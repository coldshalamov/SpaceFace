<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACEFACE — Title (prototype)</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../kit/motion.css">
<link rel="stylesheet" href="../kit/fh.css">
<style>
  /* The title screen. Layout numbers are the frame's own (tools/frame_title.py L{...}) so the
   * prototype and the frame can be overlaid in _compare.html and the delta means something. */
  html, body { margin: 0; height: 100%; background: var(--fh-ground); overflow: hidden; }
  .screen { position: relative; width: 100vw; height: 100vh; overflow: hidden;
            container-type: size; }

  /* The whole screen is laid out at 1920x1080 and scaled to fit, so one set of numbers serves
   * 1280, 1920 and 2560 — and the frame comparison is exact at any window size. */
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
           transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: center; }

  .world { position: absolute; inset: 0;
           background: url('../../../../design/frontend/direction/approved/plates/plate-title-v2.png')
                       center / cover no-repeat; }
  .world[data-v='1'] { background-image: url('../../../../design/frontend/direction/approved/plates/plate-title-v1.png'); }
  .world[data-v='3'] { background-image: url('../../../../design/frontend/direction/approved/plates/plate-title-v3.png'); }

  /* a real lens vignette, matching the frame's own */
  .vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse 72% 72% at 50% 50%,
                          rgba(0,0,0,0) 55%, rgba(0,0,0,.30) 100%); }


  /* Browser default margins are the quiet killer of a frame match: an <h1> carries
     margin:0.67em at its 2em default size, which is exactly 21 px, and a <p> carries 1em.
     Absolute positioning does not remove them — they offset the box inside its `top`. */
  .wordmark, .save, .version, .menu { margin: 0; padding: 0; }
  .wordmark { position: absolute; left: 118px; top: 104px; width: 1180px; color: #EDD9BE; }
  .wordmark svg { display: block; width: 100%; height: auto; }

  .rail { position: absolute; left: 112px; top: 322px; width: 64px; height: 604px; }

    /* The frame paints each menu item's INK TOP at 350 + i*84 (its text mask is cropped to the
     ink). A flex row centres 40 px type in an 84 px box, which lands the ink 28 px lower — so
     the column is offset by exactly that. Measured, not guessed: tools/measure_delta.py. */
  .menu { position: absolute; left: 232px; top: 322px; display: flex; flex-direction: column; }
  .menu li { list-style: none; height: 84px; display: flex; align-items: center; }
  .menu .fh-menu-item { background: none; border: 0; padding: 0; cursor: pointer;
                        font: inherit; color: var(--fh-text-resting);
                        font-family: var(--fh-face-display);
                        font-variation-settings: 'wght' 800, 'wdth' 125;
                        letter-spacing: var(--fh-track-display); text-transform: uppercase;
                        font-size: var(--fh-size-menu); line-height: .9; }
  .menu li[aria-selected='true'] .fh-menu-item { color: var(--fh-text); }
  .menu li[aria-disabled='true'] .fh-menu-item { color: var(--fh-text-tertiary);
                                                 cursor: default; }

  /* the focused row's light: the produced plate.row.selected, positioned to meet the rail */
  .focuslight { position: absolute; left: 122px; width: 560px; height: 60px;
                pointer-events: none;
                border-style: solid; border-width: 8px 16px;
                border-image-source: url('../assets/plates/plate.row.selected.png');
                border-image-slice: 8 16 8 16 fill; border-image-repeat: stretch;
                border-image-width: 8px 16px;
                transition: top var(--fh-bench-slide, 200ms)
                            cubic-bezier(0.2, 0.8, 0.2, 1); }

  .status { position: absolute; left: 204px; top: 949px; height: 44px;
            display: inline-flex; align-items: center; padding: 0 28px;
            border-style: solid; border-width: 12px 16px;
            border-image-source: url('../assets/plates/plate.legend.strip.png');
            border-image-slice: 12 16 12 16 fill; border-image-repeat: stretch;
            border-image-width: 12px 16px; }
  .status .fh-legend { font-size: 15px; letter-spacing: .09em; }

  .save { position: absolute; left: 232px; top: 1018px; color: var(--fh-text-resting);
          font-family: var(--fh-face-text); font-size: var(--fh-size-body); }
  .version { position: absolute; left: 118px; top: 1042px; display: flex; gap: 8px;
             align-items: center; color: var(--fh-text-tertiary);
             font-family: var(--fh-face-display);
             font-variation-settings: 'wght' 600, 'wdth' 62;
             letter-spacing: var(--fh-track-legend); font-size: var(--fh-size-fine); }

  .variants { position: absolute; right: 26px; bottom: 22px; display: flex; gap: 8px;
              opacity: .55; }
  .variants a { color: var(--fh-text-resting); text-decoration: none;
                font-family: var(--fh-face-display);
                font-variation-settings: 'wght' 600, 'wdth' 62; font-size: 12px;
                letter-spacing: .06em; padding: 4px 8px; }
  .variants a[aria-current] { color: var(--fh-signal); }

  @media (prefers-reduced-motion: reduce) { .focuslight { transition: none; } }
</style>
</head>
<body class="fh-root">
<main class="screen">
  <div class="stage fh-parallax" id="stage">
    <div class="world" id="world"></div>
    <div class="vignette"></div>

    <h1 class="wordmark" id="wordmark"></h1>
    <div class="rail fh-rail" aria-hidden="true"></div>
    <div class="focuslight" id="focuslight" aria-hidden="true"></div>
    <ul class="menu" id="menu" role="menu" aria-label="Main menu"></ul>

    <div class="status"><span class="fh-legend" data-fh-lit="on" id="status"></span></div>
    <p class="save" id="save"></p>
    <p class="version"><span class="fh-light" data-colour="good"></span><span id="version"></span></p>

    <nav class="variants" aria-label="World shot">
      <a href="?v=1">V1 HANGAR</a><a href="?v=2">V2 FIELD</a><a href="?v=3">V3 BAY DOOR</a>
    </nav>
  </div>
</main>

<script src="fixtures.js"></script>
<script src="../kit/sprites.js"></script>
<script src="../kit/sound-recipes.js"></script>
<script src="../kit/motion.js"></script>
<script src="../kit/sound.js"></script>
<script src="../kit/fh.js"></script>
<script>
(function () {
  var T = FIXTURES.title;
  FH.kit.init({ sprite: window.FH_SPRITES.all });

  var v = (location.search.match(/v=([123])/) || [, '2'])[1];
  document.getElementById('world').setAttribute('data-v', v);
  document.querySelectorAll('.variants a').forEach(function (a) {
    if (a.getAttribute('href') === '?v=' + v) a.setAttribute('aria-current', 'page');
  });

  // the wordmark is the PRODUCED logotype, not type set here
  document.getElementById('wordmark').innerHTML =
    // the mark's own viewBox, read from the produced SVG — typing a different one here
    // rescales the symbol inside it and the wordmark lands 64 px low
    '<svg viewBox="0 0 684.7 60" role="img" aria-label="SPACEFACE">' +
    '<use href="#mark-logotype"/></svg>';

  document.getElementById('status').textContent = T.status;
  document.getElementById('save').textContent = T.save;
  document.getElementById('version').textContent = T.version;

  var menu = document.getElementById('menu');
  menu.innerHTML = T.menu.map(function (m, i) {
    return '<li role="none"' + (m.focused ? ' aria-selected="true"' : '') +
      (m.disabled ? ' aria-disabled="true"' : '') + '>' +
      '<button class="fh-menu-item" role="menuitem" data-i="' + i + '"' +
      (m.disabled ? ' disabled' : '') + ' data-fh-focus-cue="ui_legend_on">' +
      m.label + '</button></li>';
  }).join('');

  var light = document.getElementById('focuslight');
  var items = Array.prototype.slice.call(menu.querySelectorAll('.fh-menu-item'));
  var focused = 0;

  function moveLight(i) {
    focused = i;
    light.style.top = (322 + i * 84 + 18) + 'px';
    menu.querySelectorAll('li').forEach(function (li, n) {
      li.toggleAttribute('aria-selected', n === i);
    });
  }
  moveLight(0);

  items.forEach(function (b, i) {
    b.addEventListener('focus', function () {
      if (!b.disabled) { moveLight(i); FH.sound.play('ui_legend_on'); }
    });
    b.addEventListener('pointerenter', function () { if (!b.disabled) moveLight(i); });
    b.addEventListener('click', function () { FH.sound.play('ui_confirm'); });
  });

  // keyboard: the menu is a real roving-focus menu, not a list of divs
  menu.addEventListener('keydown', function (e) {
    var usable = items.filter(function (b) { return !b.disabled; });
    var here = usable.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      var next = usable[(here + (e.key === 'ArrowDown' ? 1 : -1) + usable.length) % usable.length];
      next.focus();
      e.preventDefault();
    }
    if (e.key === 'Home') { usable[0].focus(); e.preventDefault(); }
    if (e.key === 'End') { usable[usable.length - 1].focus(); e.preventDefault(); }
  });

  // POSTER reveal on load: the wordmark stamps in, the menu staggers at 40 ms
  FH.motion.reveal(document.getElementById('wordmark'), { register: 'poster', from: 'stamp' });
  FH.motion.group(items, { register: 'poster', from: 'below' });
  FH.motion.reveal(document.querySelector('.status'), { register: 'poster', index: 8 });
  FH.motion.parallax(document.getElementById('stage'), { max: 6 });

  // fit 1920x1080 into whatever window this is, so one layout serves every width
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.getElementById('stage').style.setProperty('--fit', s);
  }
  addEventListener('resize', fit);
  fit();
  items[0].focus({ preventScroll: true });
})();
</script>
</body>
</html>
