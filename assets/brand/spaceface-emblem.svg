<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">SpaceFace emblem — The Unclosed Eye</title>
  <desc id="sf-desc">An asymmetric, fractured shell surrounds a suspended ember. A folded crescent, an open upper seam and a lower cleft suggest an unfamiliar face or an incomplete orbital machine.</desc>
  <defs>
    <linearGradient id="sf-shell" x1="112" y1="101" x2="302" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F0DF"/>
      <stop offset=".34" stop-color="#E5D8C0"/>
      <stop offset=".72" stop-color="#C3AF8E"/>
      <stop offset="1" stop-color="#938064"/>
    </linearGradient>
    <linearGradient id="sf-jaw" x1="408" y1="173" x2="236" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EBDDCA"/>
      <stop offset=".48" stop-color="#C8B99E"/>
      <stop offset="1" stop-color="#A48B67"/>
    </linearGradient>
    <linearGradient id="sf-ember" x1="243" y1="245" x2="235" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE2A0"/>
      <stop offset=".38" stop-color="#F2B950"/>
      <stop offset="1" stop-color="#D98935"/>
    </linearGradient>
    <linearGradient id="sf-ridge" x1="173" y1="106" x2="190" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EB" stop-opacity=".76"/>
      <stop offset="1" stop-color="#FFF8EB" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sf-silhouette"><path d="M303 40C158 56 69 172 85 301C94 381 153 438 224 459C169 416 151 361 165 311C179 257 225 227 293 197C358 168 386 111 363 68L336 116C307 157 277 170 234 185C219 135 246 83 303 40Z M389 98C450 174 452 285 399 365C361 423 304 454 247 458L272 393C325 368 358 326 362 277C364 244 350 214 330 198L369 163Z M231 276C248 245 277 232 305 235C290 259 266 278 231 276Z"/></clipPath>
  </defs>
