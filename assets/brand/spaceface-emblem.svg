    <path id="sf-counterform" fill="url(#sf-jaw)" d="M389 98C450 174 452 285 399 365C361 423 304 454 247 458L272 393C325 368 358 326 362 277C364 244 350 214 330 198L369 163Z"/>
    <path id="sf-suspended-ember" fill="url(#sf-ember)" d="M231 276C248 245 277 232 305 235C290 259 266 278 231 276Z"/>
