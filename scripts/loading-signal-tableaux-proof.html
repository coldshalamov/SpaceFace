<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpaceFace — original intro host verification</title><style>body{margin:0;background:#060b11;color:#c9dfe0;font:14px system-ui}header,nav{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#stage{position:relative;height:75vh;background:#04090e}canvas{width:100%;height:100%;display:block}button,select{font:inherit;padding:8px;background:#17212a;color:inherit;border:1px solid #455864}p{margin:10px 20px;color:#93aeb2}</style><header><strong>ORIGINAL INTRO HOST / LIVE CHECK</strong><select id="backend" aria-label="Backend"><option value="gl">WebGL (automatic fallback)</option><option value="2d">Force existing 2D fallback</option></select><label><input type="checkbox" id="reduce">Reduced motion</label><button id="pause">Pause</button><output id="status"></output></header><div id="stage"></div><nav id="scenes"></nav><p>This page imports the game's actual createTerminalArtwork. It is a development witness, not another production renderer. Returning to the normal game route uses the same integration.</p><script type="module">
import {createTerminalArtwork} from '../src/ui/loadingTerminalArt.js';
let art=null,paused=false;const stage=document.querySelector('#stage');
function mount(){art?.destroy();const canvas=document.createElement('canvas');stage.replaceChildren(canvas);document.documentElement.classList.toggle('sf-reduce-motion',document.querySelector('#reduce').checked);art=createTerminalArtwork({canvas,overlay:stage,force2D:document.querySelector('#backend').value==='2d'});art.start();paused=false;document.querySelector('#pause').textContent='Pause';}
for(const [i,name]of ['Pilot','Courier','Anchorage','Massline','Event horizon'].entries()){const b=document.createElement('button');b.textContent=name;b.onclick=()=>art.__engine.receive({type:'lab',act:i,t:i*6.5,freeze:false});document.querySelector('#scenes').append(b);}
const auto=document.createElement('button');auto.textContent='Full cycle';auto.onclick=()=>art.__engine.receive({type:'lab',act:-1,t:0,freeze:false});document.querySelector('#scenes').append(auto);
document.querySelector('#pause').onclick=()=>{paused=!paused;art[paused?'stop':'start']();document.querySelector('#pause').textContent=paused?'Resume':'Pause';};document.querySelector('#backend').onchange=mount;document.querySelector('#reduce').onchange=mount;
setInterval(()=>{document.querySelector('#status').textContent=art?.__status()||'Not initialized';},500);document.addEventListener('visibilitychange',()=>{if(document.hidden)art?.stop();else if(!paused)art?.start();});addEventListener('pagehide',()=>art?.destroy());mount();window.getIntroWitness=()=>art;
</script></html>
