<!DOCTYPE html>
<html lang="en" data-ui-theme="orbital">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Browser chrome (tab strip / mobile bar) tints to the game background instead of default white. -->
  <meta name="theme-color" content="#101516" />
  <title>SpaceFace</title>
  <link rel="icon" type="image/svg+xml" href="assets/ui/orbital/brand.svg" />
  <link rel="stylesheet" href="./styles/ui.css" />
  <link rel="stylesheet" href="./styles/fonts.css" />
  <link rel="stylesheet" href="./styles/menu.css" />
  <link rel="stylesheet" href="./styles/intro.css" />
  <link rel="stylesheet" href="./styles/asteroid-ops.css" />
  <link rel="stylesheet" href="styles/accessibility.css">
  <!-- The frontend kit (design/frontend/direction/KIT_SPEC.md §1): tokens, temperature and the
       k- components. Loaded after the legacy sheets so its rules win on migrated screens. -->
  <link rel="stylesheet" href="./styles/kit.css" />
  <!-- Orbital: explicit production screen composition; no document-wide presentation observer.
       Keep quarks importmap below — PQ-190 VFX runtime still loads three.quarks. -->
  <link rel="stylesheet" href="./styles/orbital.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "three.quarks": "./node_modules/three.quarks/dist/three.quarks.esm.js",
      "quarks.core": "./node_modules/quarks.core/dist/quarks.core.esm.js",
      "@dimforge/rapier3d-compat": "./vendor/rapier3d-compat/rapier.mjs",
      "@floating-ui/dom": "./node_modules/@floating-ui/dom/dist/floating-ui.dom.browser.mjs",
      "@floating-ui/core": "./node_modules/@floating-ui/core/dist/floating-ui.core.browser.mjs",
      "@floating-ui/utils": "./node_modules/@floating-ui/utils/dist/floating-ui.utils.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div id="ui-root">
    <div id="hud"></div>
    <div id="modal-backdrop"></div>
    <div id="screens"></div>
    <div id="toasts">
      <!-- Status-only polite live region: toasts stack as interactive dismiss controls;
           announcing pure text here once avoids re-reading the whole stack and the "dismiss" name. -->
      <div id="toast-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div id="alerts"></div>
    <div id="boot-overlay" role="status" aria-live="polite" aria-busy="true">
      <canvas id="boot-terminal-canvas" class="boot-canvas" width="640" height="380"></canvas>
      <div class="boot-scrim" aria-hidden="true"></div>
      <header class="boot-meta" aria-hidden="true">
        <span class="boot-meta__registry">SPACEFACE · FLIGHT SYSTEMS</span>
        <span class="boot-meta__clock" data-loading-clock>00:00:00.0</span>
      </header>
      <div class="boot-lockup">
        <span class="boot-wordmark">SPACEFACE</span>
        <span class="boot-label" data-loading-label>Initializing systems…</span>
        <span class="boot-detail" data-loading-detail>Preparing your next departure</span>
        <div class="boot-progress-row" aria-hidden="true">
          <span class="boot-progress"><span data-loading-progress></span></span>
          <span class="boot-progress-pct" data-loading-pct>0%</span>
        </div>
      </div>
      <span class="boot-skip" aria-hidden="true">Press any key to skip</span>
    </div>
  </div>
  <script type="module">
    import { bootstrapLoadingTerminal } from './src/ui/loadingTerminalArt.js';
    bootstrapLoadingTerminal();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
