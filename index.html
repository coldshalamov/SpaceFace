<body>
  <canvas id="gl-canvas"></canvas>
  <div id="ui-root">
    <div id="hud"></div>
    <div id="modal-backdrop"></div>
    <div id="screens"></div>
    <div id="toasts">
      <!-- Status-only polite live region: toasts stack as interactive dismiss controls;
           announcing pure text here once avoids re-reading the whole stack and the "dismiss" name. -->
      <div id="toast-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div id="alerts"></div>
    <div id="boot-overlay" role="status" aria-live="polite" aria-busy="true">
      <canvas id="boot-terminal-canvas" class="boot-canvas"></canvas>
      <!-- The intro visualizer outranks every other boot asset: preload=auto makes its
           bytes the first download of the page (parse time, before any script), and
           bootEntry holds the game graph until the movie really plays. Native media is
           the artwork; never put the live JS remix canvas over this loading surface. -->
      <video id="boot-intro-video" class="boot-canvas boot-video" muted loop playsinline
             preload="auto" fetchpriority="high" poster="assets/cinematics/boot-visualizer.jpg" aria-hidden="true" data-boot-native="true">
        <source src="assets/cinematics/boot-visualizer.mp4" type="video/mp4" />
      </video>
      <!-- Parse-time movie kick: the boot controller lands seconds later (module graph fetch +
           eval); start the muted clip the moment its element exists so the intro's first visible
           seconds are the movie, not a paused poster frame. The controller ADOPTS the
           already-playing element (same clip: no reload, no restart). Reduced-motion/flash
           users keep the authored poster — variant choice and pausing are the controller's
           call, never a flash risk. -->
      <script>
        (function () {
          try {
            var video = document.getElementById('boot-intro-video');
            if (!video || video.paused === false) return;
            var root = document.documentElement;
            if (root.classList.contains('sf-reduce-motion')
              || root.classList.contains('sf-reduce-flash')
              || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
            var kick = video.play();
            if (kick && kick.catch) kick.catch(function () { /* the boot controller retries */ });
          } catch (error) { /* decoration never blocks boot */ }
        })();
      </script>
      <div class="boot-scrim" aria-hidden="true"></div>
      <header class="boot-meta" aria-hidden="true">
        <span class="boot-meta__registry">SPACEFACE · FLIGHT SYSTEMS</span>
        <span class="boot-meta__clock" data-loading-clock>00:00</span>
      </header>
      <div class="boot-lockup">
        <span class="boot-wordmark">SPACEFACE</span>
        <span class="boot-label" data-loading-label>Initializing systems…</span>
        <span class="boot-detail" data-loading-detail>Preparing your next departure</span>
        <div class="boot-progress-row" aria-hidden="true">
          <span class="boot-progress"><span data-loading-progress></span></span>
          <span class="boot-progress-pct" data-loading-pct>0%</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/ui/bootEntry.js"></script>
</body>
