# ─── Exported API summary ─────────────────────────────────────────────────────────────────────────
exported_api:
  constants:
    - NPC_JOB_SCHEMA          # 'npc_jobs_v1' — schema stamp on every record and projection
    - NPC_JOB_KIND            # frozen { MINER, HAULER, PATROL }
    - NPC_JOB_PHASE           # frozen { COMMISSION, DEPART, TRANSIT, APPROACH, WORK, LOAD, UNLOAD,
                              #          RETURN, HOLD, FLEE, COMPLETE }
  creation_and_validation:
    - validateJobSpec(spec)                # -> { ok, errors }; legal kind + id + >=2 finite waypoints
    - createJob(spec, masterSeed=0)        # -> fresh serializable record; deterministic in (id,kind,route,seed)
    - normalizeJob(input)                  # heal any input into a legal record; corrupt:true if unrecoverable
    - restoreJob(input)                    # save-seam alias for normalizeJob
  advance:
    - advance(job, dt, sink?)              # THE machine; returns ordered intents; decomposable;
                                           # identical path for materialized + virtualized jobs
  interrupt_resume:
    - interrupt(job, threat=null)          # -> flee, remembering prior phase; idempotent
    - resume(job)                          # restore exact prior phase/progress/routeIndex
  virtualize_materialize:
    - virtualize(job)                      # mark offscreen; pure structural flag (advance math is shared)
    - materialize(job)                     # mark onscreen; returns describeMaterialization
    - describeMaterialization(job)         # truthful {pos, heading, phase, targetId, payload, ...}
    - routePosition(job)                   # interpolated world position NOW (null if corrupt)
  serialization:
    - serializeJob(job)                    # deep-cloned, JSON-safe, schema-stamped record for save owner
    - summarizeJob(job)                    # public projection for HUD/UI/acceptance (stable shape)
    - snapFloat(value)                     # read-seam 1e-6 grid round (decomposability compare helper)

# ─── Job-kind structural differences (not labels) ─────────────────────────────────────────────────
job_graphs:
  miner:   cyclic two-place; commission→transit→approach→work(at field)→return→approach→unload(at home)→transit(loop++); never terminates
  hauler:  linear terminal; commission→load→depart→transit(chain)→approach→unload→complete; terminates once
  patrol:  cyclic N-place; commission→transit→approach→hold(dwell)→transit(wrap, loop++ on wrap-to-0); never terminates

# ─── Required invariants — proven by test ─────────────────────────────────────────────────────────
invariants_proven:
  - "Same initial state and inputs produce identical states and intents (determinism test)"
  - "Progress never becomes NaN, negative, or unbounded (bounded-aggregation + heal tests)"
  - "Large elapsed intervals advance through legal phase boundaries without duplicating completion intents (no-duplicate + huge-dt tests)"
  - "Repeated initialization is idempotent (createJob + normalizeJob idempotency tests)"
  - "Save/restore preserves phase, route progress, payload intent, interruption state, and sequence identity (save/restore tests)"
  - "Materialization never places a job at an unrelated origin or resets progress (truthful-continuity + unknown-phase-restart tests)"
  - "Miner, hauler, and patrol loops differ structurally, not only by labels (structural-difference test)"
  - "Kernel emits requests/intents only; owning systems remain responsible for spawning/movement/cargo/credits/rep (no-direct-mutation test)"
  - "Unknown or corrupt saved phases fail safely through normalization (malformed-save tests)"
  - "advance(a);advance(b) ≡ advance(a+b) in final state AND concatenated intent stream (3 decomposability tests)"

