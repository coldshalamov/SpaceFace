<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">BREAKAWAY capture geometry and custody sequence</title><desc id="d">Receiver schematic in XZ top view. Mouth at X zero, inward plus X, inner rails at plus and minus twenty-seven, rear stop at seventy-two. A sixteen-radius load must enter fully before braking.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c39b62"/></marker><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#26323b" stroke-width=".6"/></pattern></defs>
<rect width="1200" height="760" fill="#101820"/><rect x="45" y="124" width="1110" height="395" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#e9e3d2"><text x="48" y="48" font-size="13" letter-spacing="3">SPACEFACE / BREAKAWAY</text><text x="48" y="91" font-size="31">A machine must earn custody.</text><text x="1152" y="49" text-anchor="end" font-size="12" fill="#b9a47f">ENGINEERING REFERENCE / NOT GAMEPLAY</text></g>
<g transform="translate(520 330) scale(5)"><path d="M0 -34H78V-27H0Z M0 27H78V34H0Z M72 -34H79V34H72Z" fill="#69716f" stroke="#bdb49a" stroke-width=".6"/><rect x="16" y="-11" width="40" height="22" fill="#ac915d" fill-opacity=".12" stroke="#aa966c" stroke-width=".4" stroke-dasharray="1 1"/>
<path d="M0 -43V43" stroke="#edb452" stroke-width=".5" stroke-dasharray="2 1"/><circle cx="-29" cy="0" r="16" fill="#ded8c1" fill-opacity=".16" stroke="#ded8c1" stroke-width=".6"/><circle cx="37" cy="0" r="16" fill="#ded8c1" fill-opacity=".1" stroke="#ded8c1" stroke-width=".6"/>
<path d="M-65 0H-48 M-9 0H12" stroke="#c39b62" stroke-width=".6" marker-end="url(#arrow)"/>
<path d="M-5 -27H-10V27H-5 M0 -40V-44H72V-40" fill="none" stroke="#949e9d" stroke-width=".35"/></g>
<g fill="#e2dbc9" font-family="Arial,Helvetica,sans-serif"><text x="527" y="123" font-size="12">72 WU USABLE DEPTH</text><text x="478" y="475" font-size="12" text-anchor="end">54 WU CLEAR MOUTH</text><text x="354" y="438" font-size="13">R = 16 WU</text><text x="526" y="575" font-size="13">MOUTH / X = 0</text><path d="M532 550V513" stroke="#d5b57c"/><text x="682" y="429" font-size="13">BRAKING REGION</text><text x="681" y="449" font-size="11" fill="#aeb8b7">Load wholly inside; no attraction.</text><text x="90" y="293" font-size="14">FORWARD ENTRY</text><text x="90" y="315" font-size="12" fill="#aeb8b7">≤ 100 WU/s</text><text x="90" y="356" font-size="12" fill="#aeb8b7">Side / rear / overlap alone</text><text x="90" y="375" font-size="12" fill="#aeb8b7">do not count.</text></g>
<path d="M48 610H1152" stroke="#465154"/><g font-family="Arial,Helvetica,sans-serif"><text x="49" y="646" font-size="17" fill="#edb452">ACQUIRE → BRAKE → SETTLE → VERIFY → COMMIT</text><text x="49" y="677" font-size="13" fill="#d2d7d1">Stable for 21 fixed ticks: speed ≤ 8 WU/s, spin ≤ 0.45 rad/s. Fresh physical proof at preparation AND commit.</text><text x="49" y="708" font-size="13" fill="#aeb8b7">The load stays a real body until custody commits. No current custody means no mission success or reward.</text></g></svg>
