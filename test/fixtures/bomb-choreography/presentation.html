<!doctype html><meta charset="utf-8"><title>SpaceFace · bomb presentation inspection</title>
<style>
body{margin:0;background:#070b10;color:#d5e0e4;font:13px system-ui}
canvas{display:block;width:100vw;height:calc(100vh - 72px)}
header{height:40px;display:flex;align-items:center;gap:10px;padding:0 16px;flex-wrap:wrap}
strong{letter-spacing:.12em;font-size:11px}
small{color:#7e8b91}
footer{height:32px;padding:0 16px;font:12px ui-monospace,monospace;color:#9aa7ac}
button{color:inherit;background:#182228;border:1px solid #3d4a51;padding:5px 10px;cursor:pointer}
button[aria-pressed="true"]{background:#2a3d48;border-color:#7bd0e6}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
<header>
  <strong>ORDNANCE / PRESENTATION INSPECTION</strong>
  <small>Production mesh + existing bomb bodies · combat-tilt camera · not the full game route</small>
  <button id="fields" aria-pressed="true">Fields</button>
  <button id="warning">Warning</button>
  <button id="drift">Drift</button>
  <button id="six">6 mixed</button>
  <button id="stress">24 stress</button>
  <button id="zoom-close">Close 58</button>
  <button id="zoom-combat" aria-pressed="true">Combat 144</button>
  <button id="zoom-wide">Wide 330</button>
  <button id="motion">Motion reduce</button>
  <button id="flash">Flash reduce</button>
</header>
<script type="module">
import * as THREE from 'three';
import { updateBombPresentation, bombPresentationStats, releaseBombPresentation } from '/src/render/bombPresentation.js';
import { createVisualFactory } from '/src/render/visualFactory.js';
import { BOMB_IDS } from '/src/data/bombs.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#070b10');
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 1, 14000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xb8c8d4, 1.4));
const key = new THREE.DirectionalLight(0xf2efe4, 2.6);
key.position.set(-120, 280, 90);
scene.add(key);
const fill = new THREE.DirectionalLight(0x6f88a0, 0.7);
fill.position.set(160, 80, -120);
scene.add(fill);

const state = {
  mode: 'flight', simTime: 1, settings: { video: {} },
  world: { frameOrigin: { x: 0, z: 0 } }, entityList: [], render: { scene, camera },
};
const factory = createVisualFactory();
let bodies = [];
const footer = document.createElement('footer');
document.body.appendChild(footer);

const ui = {
  mode: 'fields',
  zoom: 144,
  video: { motionReduce: false, flashReduce: false },
};

function lookTarget() {
  if (ui.mode === 'fields' && ui.zoom <= 70) return { x: -130, z: 0 };
  return { x: 0, z: 0 };
}

function placeCamera(distance) {
  const tilt = 60 * Math.PI / 180;
  const look = lookTarget();
  camera.position.set(look.x, distance * Math.sin(tilt), look.z - distance * Math.cos(tilt));
  camera.up.set(0, 1, 0);
  camera.lookAt(look.x, 0, look.z);
  camera.updateMatrixWorld(true);
  camera.aspect = innerWidth / Math.max(1, innerHeight - 72);
  camera.updateProjectionMatrix();
}

function idsFor(mode) {
  if (mode === 'fields') return ['bomb_singularity', 'bomb_goo'];
  if (mode === 'six') return BOMB_IDS.slice(0, 6);
  if (mode === 'stress') {
    const out = [];
    for (let i = 0; i < 24; i++) out.push(BOMB_IDS[i % BOMB_IDS.length]);
    return out;
  }
  return BOMB_IDS;
}

function layout(mode, i, n) {
  if (mode === 'fields') return { x: i === 0 ? -130 : 130, z: 0 };
  if (mode === 'six') return { x: (i % 3 - 1) * 150, z: (Math.floor(i / 3) - 0.5) * 140 };
  if (mode === 'stress') {
    const col = i % 6, row = Math.floor(i / 6);
    return { x: (col - 2.5) * 210, z: (row - 1.5) * 200 };
  }
  return { x: (i % 4 - 1.5) * 140, z: (Math.floor(i / 4) - 0.5) * 150 };
}

function phaseFor(mode, id, i) {
  if (mode === 'fields') return 'field';
  if (mode === 'six') return i < 2 ? 'field' : i < 4 ? 'warning' : 'drift';
  if (mode === 'stress' && (id === 'bomb_singularity' || id === 'bomb_goo')) return 'field';
  if (mode === 'warning') return 'warning';
  return 'drift';
}

function rebuild() {
  releaseBombPresentation(state);
  state.simTime = 1;
  for (const body of bodies) scene.remove(body);
  bodies = [];
  state.entityList = [];
  state.settings.video = { ...ui.video };
  const ids = idsFor(ui.mode);
  ids.forEach((id, i) => {
    const { x, z } = layout(ui.mode, i, ids.length);
    const phase = phaseFor(ui.mode, id, i);
    const e = {
      id: i + 1, type: 'bomb', alive: true, pos: { x, z }, prevPos: { x, z },
      vel: { x: 90, z: 0 }, rot: 0, radius: 1.4,
      data: {
        bombId: id, kind: 'bomb', phase, armed: true, spawnedAt: 0,
        fieldStartedAt: 0, fieldEndsAt: 5, warningAt: 0.9, resolveAt: 1.08,
      },
    };
    state.entityList.push(e);
    const body = factory.build(e);
    body.position.set(x, 1, z);
    body.scale.setScalar(3);
    bodies.push(body);
    scene.add(body);
  });
  placeCamera(ui.zoom);
}

function press(id, on) {
  const el = document.getElementById(id);
  if (el) el.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function setMode(mode) {
  ui.mode = mode;
  press('fields', mode === 'fields');
  press('warning', mode === 'warning');
  press('drift', mode === 'drift');
  press('six', mode === 'six');
  press('stress', mode === 'stress');
  rebuild();
}

function setZoom(zoom, id) {
  ui.zoom = zoom;
  press('zoom-close', id === 'zoom-close');
  press('zoom-combat', id === 'zoom-combat');
  press('zoom-wide', id === 'zoom-wide');
  placeCamera(zoom);
}

function toggle(key, id) {
  ui.video[key] = !ui.video[key];
  state.settings.video = { ...ui.video };
  press(id, ui.video[key]);
}

function statsLine() {
  const stats = bombPresentationStats(state);
  const label = ui.mode === 'fields'
    ? 'PULL / Neutron slug          TAR / Tarburst bladder'
    : ui.mode === 'stress' ? '24-bomb world ceiling'
    : BOMB_IDS.map((x) => x.replace('bomb_', '')).join('   ·   ');
  return `${label} | zoom ${ui.zoom} | field batch ${stats.drawCalls} draw, ${stats.vertices} verts | ${renderer.info.render.calls} total draws`;
}

let hitchMs = null;
function tick() {
  state.simTime += 1 / 60;
  const t0 = performance.now();
  updateBombPresentation(state, 1);
  const cost = performance.now() - t0;
  if (hitchMs == null) hitchMs = cost;
  renderer.info.reset();
  renderer.render(scene, camera);
  footer.textContent = `${statsLine()} | last fill ${cost.toFixed(2)} ms | first fill ${hitchMs.toFixed(2)} ms`;
  window.probeResult = {
    ...bombPresentationStats(state),
    hitchMs,
    fillMs: cost,
    zoom: ui.zoom,
    mode: ui.mode,
    motionReduce: !!ui.video.motionReduce,
    flashReduce: !!ui.video.flashReduce,
    totalDrawCalls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
  };
}

function percentile(samples, p) {
  const sorted = samples.slice().sort((a, b) => a - b);
  return sorted[Math.min(sorted.length - 1, Math.floor(p * (sorted.length - 1)))];
}

async function measurePacing(frames = 90) {
  const fill = [];
  const frame = [];
  for (let i = 0; i < frames; i++) {
    state.simTime += 1 / 60;
    const tFill = performance.now();
    updateBombPresentation(state, 1);
    const fillMs = performance.now() - tFill;
    const tSubmit = performance.now();
    renderer.render(scene, camera);
    frame.push(fillMs + (performance.now() - tSubmit));
    fill.push(fillMs);
    await new Promise((resolve) => requestAnimationFrame(resolve));
  }
  return {
    n: fill.length,
    fillP50: percentile(fill, 0.5), fillP95: percentile(fill, 0.95), fillMax: percentile(fill, 1),
    p50: percentile(frame, 0.5), p95: percentile(frame, 0.95), max: percentile(frame, 1),
    hitchMs, vertices: bombPresentationStats(state).vertices,
    drawCalls: bombPresentationStats(state).drawCalls, zoom: ui.zoom, mode: ui.mode,
  };
}

function draw(mode = 'fields', video = {}, zoom = ui.zoom) {
  ui.mode = mode;
  ui.video = { motionReduce: !!video.motionReduce, flashReduce: !!video.flashReduce };
  ui.zoom = zoom;
  press('fields', mode === 'fields');
  press('warning', mode === 'warning');
  press('drift', mode === 'drift');
  press('six', mode === 'six');
  press('stress', mode === 'stress');
  press('motion', ui.video.motionReduce);
  press('flash', ui.video.flashReduce);
  press('zoom-close', zoom <= 70);
  press('zoom-combat', zoom > 70 && zoom < 240);
  press('zoom-wide', zoom >= 240);
  hitchMs = null;
  rebuild();
  tick();
  return window.probeResult;
}

window.drawProbe = draw;
window.measurePacing = measurePacing;
window.inspectState = state;
for (const id of ['fields', 'warning', 'drift', 'six', 'stress']) {
  document.querySelector('#' + id).onclick = () => { hitchMs = null; setMode(id); };
}
document.querySelector('#zoom-close').onclick = () => setZoom(58, 'zoom-close');
document.querySelector('#zoom-combat').onclick = () => setZoom(144, 'zoom-combat');
document.querySelector('#zoom-wide').onclick = () => setZoom(330, 'zoom-wide');
document.querySelector('#motion').onclick = () => toggle('motionReduce', 'motion');
document.querySelector('#flash').onclick = () => toggle('flashReduce', 'flash');
addEventListener('resize', () => placeCamera(ui.zoom));
rebuild();
function loop() { tick(); requestAnimationFrame(loop); }
loop();
window.probeReady = true;
</script>
