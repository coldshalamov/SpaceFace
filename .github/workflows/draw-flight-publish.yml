name: Publish verified arcade draw-flight candidate
on:
  push:
    branches: [fix/arcade-draw-to-fly]
    paths:
      - '.github/arcade-draw-transfer/**'
      - '.github/workflows/draw-flight-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'coldshalamov/SpaceFace' && github.ref == 'refs/heads/fix/arcade-draw-to-fly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            src
            vendor
            test
            scripts
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact locally tested source, fail closed on every byte
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/arcade-draw-to-fly'
          root = pathlib.Path.cwd()
          parts = [(root / '.github/arcade-draw-transfer' / ('part%d.gzpart' % i)).read_bytes() for i in (1,2,3)]
          # Normalize the known transport duplicate; the complete source hash is authoritative.
          middle = base64.b64encode(parts[1]).decode() + '0'
          middle = middle.replace('NB4tgvhhOBvhhOBv1', 'NB4tgvhhOBv1', 1)
          parts[1] = base64.b64decode(middle, validate=True)
          packet = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(packet).hexdigest() == '3fac75082fefbd9668e4be08aa9f0eede1a3a2aa13e94bf69f9d6bebdb1de4e4'
          data = json.loads(packet)
          assert data['baseCommit'] == '9043f0e27f295e661c6efa3ed8e1977ceb51d5e6'
          def blob(b):
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          paths = []
          for entry in data['files']:
              rel = entry['path']
              assert rel.startswith(('src/', 'test/', 'scripts/')) and '..' not in pathlib.PurePosixPath(rel).parts
              p = root / rel
              old = p.read_bytes() if p.exists() else None
              assert (blob(old) if old is not None else None) == entry['base'], 'base mismatch: ' + rel
              lines = (old or b'').decode().splitlines(keepends=True)
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['a'] <= edit['b'] <= len(lines)
                  lines[edit['a']:edit['b']] = edit['text'].splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert blob(new) == entry['result'], 'result mismatch: ' + rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(new)
              paths.append(rel)
          assert len(paths) == 18 and len(set(paths)) == 18
          pathlib.Path('/tmp/draw-flight-paths.json').write_text(json.dumps(paths))
          print('Verified all 18 candidate file hashes')
          PY
      - name: Use exact vendored Three and Rapier, matching the browser runtime
        shell: bash
        run: |
          mkdir -p node_modules/three node_modules/@dimforge/rapier3d-compat .devshots/draw-flight
          cp vendor/three.module.js vendor/three.core.js node_modules/three/
          ln -s ../../vendor/addons node_modules/three/addons
          printf '%s' '{"type":"module","exports":{".":"./three.module.js","./addons/*":"./addons/*"}}' > node_modules/three/package.json
          cp vendor/rapier3d-compat/rapier.mjs node_modules/@dimforge/rapier3d-compat/rapier.mjs
          printf '%s' '{"type":"module","exports":"./rapier.mjs"}' > node_modules/@dimforge/rapier3d-compat/package.json
      - name: Reject a candidate that fails focused flight, aim or input regression
        shell: bash
        run: |
          set -o pipefail
          node --test test/arcade-draw-*.test.mjs test/draw-to-fly-path-tracking.test.mjs test/draw-to-fly-stroke-speed.test.mjs test/flightV3.spec.mjs test/input-lifecycle.test.mjs test/seam-gunnery.test.mjs test/starter-weapon-runtime.test.mjs | tee .devshots/draw-flight/tests.txt
          node scripts/check-autopursuit.mjs | tee .devshots/draw-flight/wiring.txt
          node scripts/check-input-modalities.mjs | tee .devshots/draw-flight/input.txt
      - name: Commit only the verified gameplay and regression paths to the requested branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/draw-flight-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','commit','-m','Replace tramline flight with full-speed trackpad steering and independent gun lead'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/arcade-draw-to-fly'],check=True)
          PY
          git rev-parse HEAD > .devshots/draw-flight/source-sha.txt
      - name: Install the repository-declared Playwright version for browser input acceptance
        run: |
          npm install --prefix /tmp/draw-flight-browser --ignore-scripts --no-audit --no-fund playwright@1.61.1
          ln -s /tmp/draw-flight-browser/node_modules/playwright node_modules/playwright
          node /tmp/draw-flight-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise real mouse events, pointer lock, camera motion and brake
        run: node scripts/check-draw-flight-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-flight-candidate-evidence
          path: .devshots/draw-flight
          retention-days: 7
