name: Apply verified saucer fix
on:
  push:
    branches: ['fix/saucer-inertialess-alien-arsenal']
    paths: ['.github/workflows/saucer-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saucer-inertialess-alien-arsenal
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            src
            test
            scripts
            styles
            docs
            .saucer-transfer
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'.saucer-transfer/part{i}').read_text().strip() for i in (1,2,3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '92540772d469f68a784b5888947069f2f893fbfca3b5cabbf762d0613e17ea8a', 'Transport checksum mismatch'
          Path('/tmp/saucer.patch').write_bytes(patch)
          print('Verified reviewed source patch:', len(patch), 'bytes')
          PY
          git config core.whitespace cr-at-eol
          git apply --check --whitespace=nowarn /tmp/saucer.patch
          git apply --whitespace=nowarn /tmp/saucer.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess
          pairs = re.findall(r'^diff --git a/(\S+) b/(\S+)$', Path('/tmp/saucer.patch').read_text(), re.M)
          assert len(pairs) == 23 and all(a == b for a,b in pairs)
          paths = [b for a,b in pairs]
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          digest = hashlib.sha256(json.dumps(hashes,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert digest == 'b630946d6a8670ec5f0428557e9e878b3c10dd67b6772a43d72489ae4bb4ef25', 'Applied files differ from reviewed ZIP'
          Path('/tmp/saucer-file-hashes.json').write_text(json.dumps(hashes,indent=2))
          subprocess.run(['git','add','--',*paths], check=True)
          print('All 23 applied files match the reviewed ZIP byte for byte.')
          PY
          git diff --cached --check
      - name: Install exact focused-test dependencies
        shell: bash
        run: |
          mkdir /tmp/saucer-deps
          cd /tmp/saucer-deps
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund @dimforge/rapier3d-compat@0.19.3 three@0.184.0 three-mesh-bvh@0.9.15 three.quarks@0.17.1 @floating-ui/dom@1.8.0
          ln -s /tmp/saucer-deps/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Run physics, input, arsenal, Crucible and save/reload regression gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-saucer.mjs 2>&1 | tee /tmp/saucer-validation.log
      - name: Commit only reviewed changes and retire transfer files
        shell: bash
        run: |
          git rm -- .saucer-transfer/part1 .saucer-transfer/part2 .saucer-transfer/part3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(saucer): inertialess flight, intrinsic alien arsenal and clear Crucible ownership'
          git push origin HEAD:fix/saucer-inertialess-alien-arsenal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saucer-validation
          path: |
            /tmp/saucer-validation.log
            /tmp/saucer-file-hashes.json
          retention-days: 7
