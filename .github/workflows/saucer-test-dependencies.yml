name: Saucer test dependencies
on:
  push:
    branches: ['fix/saucer-inertialess-alien-arsenal']
    paths: ['.github/workflows/saucer-test-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir deps && cd deps
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund @dimforge/rapier3d-compat@0.19.3 three@0.184.0 three-mesh-bvh@0.9.15 three.quarks@0.17.1 @floating-ui/dom@1.8.0
          tar -czf /tmp/saucer-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: saucer-test-dependencies
          path: /tmp/saucer-dependencies.tar.gz
          retention-days: 2
