name: Consolidation wave 1 build

on:
  push:
    branches:
      - integration/all-branches-20260824
    paths:
      - .consolidation-wave1-request
      - scripts/build-consolidation-wave1.sh
      - .github/workflows/consolidation-wave1-build.yml
  pull_request:
    branches:
      - master
    paths:
      - .consolidation-wave1-request
      - scripts/build-consolidation-wave1.sh
      - .github/workflows/consolidation-wave1-build.yml

permissions:
  contents: write

concurrency:
  group: consolidation-wave1-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout integration control surface
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.consolidation-wave1-request
            /scripts/branch-consolidation-audit.mjs
            /scripts/branch-family-topology.mjs
            /scripts/branch-patch-outcomes.mjs
            /scripts/consolidation-portability-probe.mjs
            /scripts/build-consolidation-wave1.sh
            /.github/workflows/branch-consolidation-audit.yml
            /.github/workflows/consolidation-portability.yml
            /.github/workflows/consolidation-wave1-build.yml
          persist-credentials: true

      - name: Check one-shot build authorization
        id: request
        run: |
          if [[ -f .consolidation-wave1-request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Wave 1 request marker is absent; this event is the post-build no-op."
          fi

      - name: Assemble, validate, and publish one current-master integration branch
        if: steps.request.outputs.run == 'true'
        run: bash scripts/build-consolidation-wave1.sh
