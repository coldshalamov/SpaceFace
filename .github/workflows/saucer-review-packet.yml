name: Saucer review packet
on:
  push:
    branches: ['fix/saucer-inertialess-alien-arsenal']
    paths: ['.github/workflows/saucer-review-packet.yml']
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            src
            test
            scripts
            styles
            docs
          sparse-checkout-cone-mode: true
      - name: Package source without model assets
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed = {'.js','.mjs','.cjs','.json','.md','.css','.html','.ts','.yml','.yaml','.txt'}
          with zipfile.ZipFile('/tmp/spaceface-saucer-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in paths:
              p = pathlib.Path(name)
              if p.is_file() and p.suffix in allowed and p.stat().st_size < 4000000:
                z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spaceface-saucer-source
          path: /tmp/spaceface-saucer-source.zip
          retention-days: 2
