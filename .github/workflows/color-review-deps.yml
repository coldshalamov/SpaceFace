# Temporary review transport, removed from the final PR.
name: color-review-deps
on:
  push:
    branches: [design/intentional-color-20261014]
    paths: [.github/workflows/color-review-deps.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir review && cd review
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund three@0.184.0 three-mesh-bvh@0.9.15 three.quarks@0.17.1 @dimforge/rapier3d-compat@0.19.3 pngjs@7 jpeg-js@0.4.4
          tar -czf ../color-review-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: color-review-deps
          path: color-review-deps.tar.gz
          retention-days: 3
