name: VFX source snapshot
on:
  push:
    branches: [codex/vfx-structured-energy-20260907]
    paths: [.github/workflows/vfx-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            src
            test
            scripts
            docs
            design
            tools/vfx
            vendor
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect source and exact Three runtime
        shell: bash
        run: |
          set -euo pipefail
          THREE_VERSION=$(node -e 'const p=require("./package.json"); process.stdout.write((p.dependencies||{}).three||(p.devDependencies||{}).three||"")')
          test -n "$THREE_VERSION"
          npm install --prefix /tmp/sf-vfx-deps --ignore-scripts --no-audit --no-fund "three@$THREE_VERSION"
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/vfx-source.tar.gz', 'w:gz') as out:
              for name in names:
                  p = pathlib.Path(name)
                  if p.is_file() and p.stat().st_size < 2_000_000 and p.suffix.lower() in {'.js','.mjs','.cjs','.json','.md','.html','.css','.yml','.yaml','.glsl','.vert','.frag','.py','.txt'}:
                      out.add(p, arcname=name)
              out.add('/tmp/sf-vfx-deps/node_modules/three', arcname='node_modules/three')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vfx-source-snapshot
          path: /tmp/vfx-source.tar.gz
          retention-days: 1
          if-no-files-found: error
