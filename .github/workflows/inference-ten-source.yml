name: INFERENCE ten-unit integration
on:
  push:
    branches: ['inference/ten-units-2026-10-12']
    paths: ['.github/workflows/inference-ten-source.yml']
permissions:
  contents: write
concurrency:
  group: inference-ten-unit-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACEFACE_PLAYER_STORE_DIR: ''
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inference/ten-units-2026-10-12
          fetch-depth: 8
          sparse-checkout: |
            src
            test
            scripts
            design/program
            design/inference-workflows
            docs
            data
            styles
            tools
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Authenticate transport and merge published master
        run: |
          mkdir -p "$RUNNER_TEMP/inference-ten-evidence"
          python3 - <<'PY'
          import pathlib, base64, bz2, hashlib, os
          raw = bz2.decompress(base64.b64decode(''.join(pathlib.Path(f'.github/inference-ten-payload.{i}.txt').read_text().strip() for i in range(3)), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a4b81f128d0d0c1e2fd65c1474973ec2d4cc133540279b2ff6a1c92979e2c077', 'transport checksum mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'inference-ten.json').write_bytes(raw)
          PY
          git config user.name 'SpaceFace INFERENCE'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          git fetch --filter=blob:none --no-tags --depth=1000 origin master
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/inference-ten-evidence/integration-base.txt"
          git merge --no-edit FETCH_HEAD
      - name: Install locked test dependencies without binary download hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply, test, and commit each production unit
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'inference-ten-evidence'
          payload = json.loads((temp / 'inference-ten.json').read_text())
          units = payload['units']
          assert len(units) == 10 and len({u['id'] for u in units}) == 10
          completed = []
          def run(args, **kw):
              return subprocess.run(args, check=True, **kw)
          def check(args, logfile, timeout=180):
              with (evidence / logfile).open('w') as log:
                  result = subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, timeout=timeout)
              print(logfile, result.returncode, flush=True)
              if result.returncode: print((evidence / logfile).read_text()[-14000:], flush=True)
              result.check_returncode()
          for unit in units:
              paths = unit['paths']
              assert all(p.startswith(('src/', 'test/')) and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
              patch = temp / (unit['id'] + '.patch')
              patch.write_bytes(unit['patch'].encode('utf-8'))
              (evidence / 'current-unit.txt').write_text(unit['id'])
              check_apply = subprocess.run(['git','apply','--check',str(patch)])
              if check_apply.returncode:
                  run(['git','apply','--3way',str(patch)])
              else:
                  run(['git','apply',str(patch)])
              check(['node','--test','--test-concurrency=1','--test-timeout=60000',*unit['tests']],unit['id'] + '.tap')
              for p in paths:
                  if p.endswith(('.js','.mjs')): run(['node','--check',p])
              run(['git','add','--',*paths])
              run(['git','diff','--cached','--check'])
              run(['git','commit','-m',unit['message'],'--',*paths])
              sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              run(['git','show','--stat','--oneline','HEAD'])
              changed = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
              assert set(changed).issubset(set(paths)), 'unexpected committed path'
              completed.append({'id':unit['id'],'wf':unit['wf'],'commit':sha,'reason':unit['reason'],'considered':unit['considered'],'tests':unit['tests'],'notes':unit.get('notes',[])})
              (evidence / 'commits.json').write_text(json.dumps(completed,indent=2))
          tests = list(dict.fromkeys(t for u in units for t in u['tests']))
          check(['node','--test','--test-concurrency=1','--test-timeout=60000',*tests],'combined-focused.tap')
          for script in ['scripts/check-cruise.mjs','scripts/check-player-facing-labels.mjs']:
              check(['node',script],pathlib.Path(script).stem+'.txt')
          # Broader integrations are recorded separately and are not promoted to acceptance.
          expanded = []
          for i,test in enumerate(payload['expandedTests']):
              logpath = evidence / ('expanded-'+str(i)+'.tap')
              try:
                  with logpath.open('w') as log:
                      result = subprocess.run(['node','--test','--test-timeout=45000',test],stdout=log,stderr=subprocess.STDOUT,timeout=65)
                  expanded.append({'test':test,'exit':result.returncode})
              except subprocess.TimeoutExpired:
                  expanded.append({'test':test,'exit':'timeout'})
          (evidence / 'expanded-results.json').write_text(json.dumps(expanded,indent=2))
          # Record real production commit identities. No local snapshot SHA is published.
          for unit,record in zip(units,completed):
              run(['node','scripts/inference-record.mjs','unit','--id',unit['id'],'--wf',unit['wf'],'--mode','repair','--verdict','implemented','--verification','focused_green','--commit',record['commit'],'--reason',unit['reason'],'--fp',unit['fp']])
          report = pathlib.Path('design/program/INFERENCE_TEN_UNITS_2026-10-12.md')
          base = (evidence/'integration-base.txt').read_text().strip()
          lines = ['# INFERENCE: ten production repairs (2026-10-12)','',f'Integrated published master: `{base}`.','', 'Requested: 10. Implemented / focused green: 10. Accepted / rendered player-route proven: 0.','', 'These are ten separately committed production repairs. Tests, source transport, integration, and this receipt are support-only. Ordinary rendered Adventure/Continue and the full player-truth landing gate have not been demonstrated; publish as a draft PR, not a master acceptance claim.','', '## Production ledger','']
          for unit,record in zip(units,completed):
              lines += [f"### {unit['id']} ({unit['wf']})",f"Commit: `{record['commit']}`.",'',unit['reason'],'',f"CONSIDERED: {unit['considered']}",'', 'Focused verification: '+', '.join('`'+t+'`' for t in unit['tests'])+'.','', 'Limits: '+str(unit.get('notes','Focused system verification; rendered route unproven.')),'']
          lines += ['## Combined verification','', 'Command: `node --test --test-concurrency=1 --test-timeout=60000 <45 distinct focused test files listed above>`.','', '```text','\n'.join((evidence/'combined-focused.tap').read_text().splitlines()[-10:]),'```','', 'Also ran `node scripts/check-cruise.mjs`, `node scripts/check-player-facing-labels.mjs`, syntax checks on all owned JS/MJS files, and staged diff whitespace checks.','', '## Expanded integration checks','']
          for result in expanded: lines.append(f"- `{result['test']}`: exit `{result['exit']}` (raw logs in the integration Actions artifact).")
          lines += ['', '## Acceptance limits','', 'No balance values, golden snapshots, test thresholds, package versions, or asset readiness gates were weakened. Existing beacon/route fixtures were changed only to emit the real hostility/damage contract. Expanded failures, if present, remain visible; a focused-green outcome is not a full-game acceptance claim.']
          report.write_text('\n'.join(lines)+'\n')
          run(['git','add','--',str(report),'design/program/inference-memory.json'])
          transport = ['.github/workflows/inference-ten-source.yml',*[f'.github/inference-ten-payload.{i}.txt' for i in range(3)]]
          run(['git','rm','--',*transport])
          run(['git','commit','-m','docs(inference): record ten real production receipts and remove transport','--',str(report),'design/program/inference-memory.json',*transport])
          run(['git','push','origin','HEAD:refs/heads/inference/ten-units-2026-10-12'])
          (evidence/'published-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - name: Capture exact diagnostic state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/inference-ten-evidence"
          git status --short > "$RUNNER_TEMP/inference-ten-evidence/git-status.txt"
          git diff --binary > "$RUNNER_TEMP/inference-ten-evidence/uncommitted.patch"
          git log -15 --format='%h %s' > "$RUNNER_TEMP/inference-ten-evidence/history.txt"
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          if (temp/'inference-ten.json').exists():
              payload=json.loads((temp/'inference-ten.json').read_text())
              with zipfile.ZipFile(temp/'inference-ten-evidence/current-owner-files.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for p in sorted({p for u in payload['units'] for p in u['paths']}):
                      if pathlib.Path(p).is_file(): z.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-ten-integration-evidence
          path: ${{ runner.temp }}/inference-ten-evidence
          retention-days: 7
