name: INFERENCE ten-unit source checkout
on:
  push:
    branches: ['inference/ten-units-2026-10-12']
    paths: ['.github/workflows/inference-ten-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            test
            scripts
            design/program
            design/inference-workflows
            docs
            data
            styles
            tools
            .github
      - name: Package source and bounded fixtures only
        env:
          OUT: ${{ runner.temp }}/inference-source.tar.gz
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path('.')
          suffixes = {'.js','.mjs','.cjs','.json','.md','.txt','.html','.css','.yml','.yaml','.ts','.frag','.vert','.glsl','.wasm'}
          with tarfile.open(os.environ['OUT'], 'w:gz') as archive:
              for path in root.rglob('*'):
                  if not path.is_file() or any(p in {'.git','node_modules','assets','.campaign','vm-drop','quiet-host','player-truth'} for p in path.parts):
                      continue
                  if path.suffix in suffixes or path.name.startswith('.git'):
                      archive.add(path, arcname=str(path), recursive=False)
          print(pathlib.Path(os.environ['OUT']).stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inference-ten-source
          path: ${{ runner.temp }}/inference-source.tar.gz
          retention-days: 1
