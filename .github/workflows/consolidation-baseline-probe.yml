name: Consolidation baseline physics probe

on:
  push:
    branches:
      - integration/all-branches-20260824
    paths:
      - .github/workflows/consolidation-baseline-probe.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout untouched current master code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /test/
            /scripts/
            /package.json
            /package-lock.json
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run the two integration-boundary tests on master
        run: |
          node --test test/field-anchor-controller.test.mjs
          node --test test/weapon-impulse-consequence.test.mjs
