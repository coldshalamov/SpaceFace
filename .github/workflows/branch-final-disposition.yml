name: Final branch disposition ledger

on:
  push:
    branches:
      - integration/all-branches-20260824
    paths:
      - scripts/branch-final-disposition.mjs
      - .github/workflows/branch-final-disposition.yml

permissions:
  contents: write

concurrency:
  group: branch-consolidation-final-ledger
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/all-branches-20260824
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true

      - name: Fetch every branch and wait for the priority transaction
        run: |
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git config user.name "spaceface-integration-bot"
          git config user.email "spaceface-integration-bot@users.noreply.github.com"
          found=0
          for attempt in $(seq 1 36); do
            git fetch --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*' --prune --force
            if git cat-file -e refs/remotes/origin/integration/all-branches-20260824:design/program/branch-consolidation/priority-ports.json 2>/dev/null; then
              found=1
              break
            fi
            sleep 10
          done
          git checkout -B integration/all-branches-20260824 refs/remotes/origin/integration/all-branches-20260824
          git rebase refs/remotes/origin/master
          echo "priority_receipt_found=$found" >> "$GITHUB_ENV"

      - name: Reconstruct missing receipts if the priority workflow did not publish
        if: env.priority_receipt_found != '1'
        run: |
          node scripts/branch-consolidation-audit.mjs
          node scripts/branch-family-topology.mjs
          node scripts/branch-safe-synthesis.mjs
          git add --sparse -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(integration): port disjoint surviving branch slices [skip ci]"
          fi
          node scripts/branch-priority-port.mjs

      - name: Generate exhaustive dispositions
        run: node scripts/branch-final-disposition.mjs

      - name: Verify every remote branch has exactly one disposition
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('design/program/branch-consolidation/all-branch-dispositions.json', 'utf8'));
          const names = report.branches.map((row) => row.branch);
          if (report.branchCount < 177) throw new Error(`expected at least 177 non-master branches, found ${report.branchCount}`);
          if (new Set(names).size !== names.length) throw new Error('duplicate branch dispositions detected');
          if (report.branches.some((row) => !row.disposition || !row.reason)) throw new Error('incomplete disposition row');
          console.log(JSON.stringify({ branchCount: report.branchCount, counts: report.counts }, null, 2));
          NODE

      - name: Upload final ledger
        uses: actions/upload-artifact@v4
        with:
          name: all-branch-consolidation-ledger
          path: design/program/branch-consolidation/
          retention-days: 30

      - name: Commit and publish the ledger
        run: |
          git add --sparse -A design/program/branch-consolidation
          if ! git diff --cached --quiet; then
            git commit -m "docs(integration): classify every surviving remote branch [skip ci]"
          fi
          git push --force-with-lease origin HEAD:integration/all-branches-20260824
