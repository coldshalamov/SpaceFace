# Continuous integration for SpaceFace.
#
# Runs the CI-safe portion of the project's check suite on every push and pull request. The
# `check:ci` alias includes headless browser probes that boot the normal player route through
# Playwright, so CI installs the declared Playwright dependency plus its Chromium browser before
# running checks.
#
# A green run here means every namespaced data ref resolves, the fixed-timestep sim is
# deterministic across save/reload, and no wired gameplay contract has regressed.
name: check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel a superseded in-flight run on the same ref (push-then-PR, or force-push).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Program-control validation verifies integrated receipts against commits reachable from
          # HEAD, so CI needs history rather than the action's default single-commit checkout.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 43's npm tooling requires Node >=22.12. The headless checks also use esbuild,
          # so CI installs the declared dependency graph on the same supported host line.
          node-version: '22'
          cache: 'npm'

      # Install dev dependencies. npm ci is faster + deterministic on CI.
      - name: Install dependencies
        run: npm ci

      # Keep the VFX contract independently observable even when an unrelated program-control
      # document blocks the wider matrix. This is the executable oracle for PRs touching the player
      # plume/contrail path, not a substitute for the full suite below.
      - name: Validate immutable thruster history
        run: node --test test/plasma-stream-thruster.test.mjs test/thruster-history-contract.test.mjs

      # Keep the focused renderer/ship contracts ahead of the repository-wide control-plane gate.
      # This makes a visual regression independently observable even when unrelated plan-index work
      # on master has temporarily made the broader control-plane validation red.
      - name: Validate visual continuity
        run: |
          npm run check:parallax
          npm run check:live-whole-ship-admission

      - name: Validate program control plane
        run: |
          node scripts/check-program-docs.mjs
          node --test test/program-control-tools.test.mjs
          node scripts/check-inference-control.mjs
          node --test test/inference-control.test.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run headless check suite (+ bundle verification)
        run: npm run check:ci
