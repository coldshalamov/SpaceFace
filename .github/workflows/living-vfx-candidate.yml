name: Living VFX candidate
on:
  push:
    branches: [codex/living-vfx-overhaul-20261012]
    paths: ['.github/workflows/living-vfx-candidate.yml', 'src/render/**', 'test/living-vfx*', 'scripts/living-vfx*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-vfx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /test/
            /vendor/
            /docs/visual-assets/
            /assets/vfx/
            /assets/ships/release/render-packages/kestrel/
            /assets/ships/release/render-packages/helios-rock-a/
            /assets/ships/release/render-packages/colossus-production-v1/
            /assets/ships/release/render-packages/ceres-refinery/
            /assets/ships/release/render-packages/cargo-pod-standard/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated renderer dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json'); console.log(['three','three.quarks','three-mesh-bvh','@dimforge/rapier3d-compat'].map(n=>n+'@'+p.dependencies[n]).join(' '))")
          npm install --prefix .vfx-ci --ignore-scripts --no-audit --no-fund $DEPS esbuild
          ln -s .vfx-ci/node_modules node_modules
      - name: Verify living VFX when present
        run: |
          if test -f scripts/living-vfx-verify.mjs; then node scripts/living-vfx-verify.mjs; fi
      - name: Install capture browser
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture shipping-asset production lab
        run: |
          mkdir -p vfx-artifact
          git rev-parse HEAD > vfx-artifact/SOURCE_COMMIT.txt
          python -m http.server 8769 > vfx-artifact/server.log 2>&1 &
          sleep 2
          python scripts/capture-vfx-gameplay-demo.py --scenario well --scenario repulsor --scenario reactor-breakup --width 1280 --height 800 --video --output vfx-artifact/shipping-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-vfx-shipping-lab
          path: vfx-artifact/
          if-no-files-found: error
          retention-days: 7
