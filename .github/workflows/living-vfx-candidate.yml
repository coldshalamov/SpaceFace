name: Living VFX candidate
on:
  push:
    branches: [codex/living-vfx-overhaul-20261012]
    paths: ['.github/workflows/living-vfx-candidate.yml', '.vfx-delivery/**']
permissions:
  contents: write
concurrency:
  group: living-vfx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/codex/living-vfx-overhaul-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            src
            scripts
            test
            docs/visual-assets
            .vfx-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed patches
        run: |
          test -f .vfx-delivery/expected.json
          git apply --unidiff-zero --check .vfx-delivery/*.patch
          git apply --unidiff-zero .vfx-delivery/*.patch
          mkdir -p vfx-artifact
          python - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('.vfx-delivery/expected.json').read_text())
          actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected}
          pathlib.Path('vfx-artifact/verified-source-hashes.json').write_text(json.dumps(actual,indent=2))
          bad=[p for p in expected if expected[p]!=actual[p]]
          assert not bad, 'Source mismatch: '+str(bad)
          print('All',len(actual),'files match the tested local source exactly.')
          PY
      - name: Install renderer check dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(['three','three.quarks','three-mesh-bvh','@dimforge/rapier3d-compat'].map(n=>n+'@'+p.dependencies[n]).join(' '))")
          npm install --prefix .vfx-ci --ignore-scripts --no-audit --no-fund $DEPS esbuild
          ln -s .vfx-ci/node_modules node_modules
      - name: Run focused regression gate
        run: |
          set -o pipefail
          node scripts/living-vfx-verify.mjs | tee vfx-artifact/verification.log
          git diff --check
      - name: Commit verified implementation to this candidate branch only
        run: |
          test "$(git ls-remote origin refs/heads/codex/living-vfx-overhaul-20261012 | cut -f1)" = "$GITHUB_SHA"
          git add src/render test/vfx-radiance-materials.test.mjs
          git rm -r .vfx-delivery
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(vfx): integrate living material transport, environmental response and family shaders'
          git push origin HEAD:refs/heads/codex/living-vfx-overhaul-20261012
          git rev-parse HEAD > vfx-artifact/PUBLISHED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-vfx-verified-source
          path: vfx-artifact/
          retention-days: 7
