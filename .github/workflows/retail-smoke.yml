# Retail smoke: build the bundle players actually receive, serve it, and boot it.
#
# Every other browser job in check.yml boots the raw-ES-module dev route. The route a player gets is the
# esbuild bundle (`npm run build:bundle` -> build/web: minified, code-split, SF_DEBUG_ONLY stripped), and a
# bundle can build green yet throw on its first line, 404 a chunk, or leak window.SF. This job builds the
# exact Vercel artifact and demands the title menu in headless Chromium on SOFTWARE GL (no GPU).
# See scripts/check-retail-boot.mjs for the checks and the reasons behind each choice.
#
# It is deliberately NOT part of the `check` chain or check.yml's four groups: the build is ~900 MB and takes
# minutes, so it runs as its own job. Do not set VERCEL_URL here - it would pin chunk URLs to /_releases/....
name: retail-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: retail-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retail-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The build container (and this job) has no use for the Electron binary; Playwright's Chromium is
        # installed explicitly below. Mirrors scripts/vercel-install.mjs.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Build the retail bundle, serve it, boot it to the title menu
        run: npm run check:retail-boot

      # This functional journey uses the public source route and read-only SF observers.
      # It is distinct from the packaged boot above. Reuse this full asset checkout rather
      # than pretending the UI fixture's sparse assets can prove a real combat launch.
      - name: Verify public source-route Swarm preparation and deployment
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        timeout-minutes: 12
        shell: bash
        env:
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .devshots/swarm-hangar-live
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          read = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          Path('.devshots/swarm-hangar-live/provenance.json').write_text(json.dumps({
              'requestedHead': os.environ['REQUESTED_HEAD'], 'checkedOutCommit': read('HEAD'),
              'checkedOutTree': read('HEAD^{tree}'), 'run': os.environ['GITHUB_RUN_ID'],
              'scope': 'Native input through the public source route; software GL; not packaged-route or performance acceptance'
          }, indent=2) + '\n')
          PY
          timeout --signal=TERM --kill-after=15s 690s node scripts/fleet/game-lock.mjs run -- \
            node scripts/check-swarm-hangar-ux.mjs --live-only \
              --out=.devshots/swarm-hangar-live 2>&1 | tee .devshots/swarm-hangar-live/journey.log

      - name: Upload the Swarm journey verdict and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-hangar-live
          path: .devshots/swarm-hangar-live/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the retail boot report and picture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-boot
          path: .devshots/retail-boot/
          if-no-files-found: ignore
          retention-days: 7
