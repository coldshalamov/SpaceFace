name: Verify and publish Crucible redesign
on:
  push:
    branches: [frontend/crucible-visual-armory]
    paths: [.github/workflows/crucible-review-bundle.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/crucible-visual-armory
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.crucible-delivery/
            /.github/workflows/crucible-review-bundle.yml
            /src/
            /styles/
            /scripts/
            /test/
            /tools/ui-bench*
            /tools/ui-fixtures*
            /vendor/
            /assets/ui/
            /assets/fonts/
            /docs/CRUCIBLE_PREPARATION_UI.md
      - name: Verify and apply the reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.crucible-delivery/part{i}.b64').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '8ce6addf501f79f36caae58dafe7048d3003428559c4bc765ad3821b21d526ce'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Source patch checksum mismatch'
          Path('/tmp/crucible.patch').write_bytes(patch)
          PY
          git apply --check /tmp/crucible.patch
          git apply /tmp/crucible.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Chromium for real browser verification
        run: npx playwright install --with-deps chromium
      - name: Focused owner and presentation regression tests
        shell: bash
        run: |
          mkdir -p .devshots/crucible-preparation
          node --test test/crucible-visual-preparation.test.mjs test/crucible-draft.test.mjs test/crucible-round-shop.test.mjs test/crucible-refit.test.mjs test/crucible-refit-focus.test.mjs test/crucible-refit-verbs.test.mjs test/crucible-prepared-loadout.test.mjs test/crucible-meta.test.mjs test/crucible-swarm.test.mjs | tee .devshots/crucible-preparation/unit-tests.log
      - name: Real UI bench interaction and responsive checks
        shell: bash
        run: node scripts/check-crucible-preparation-ui.mjs 2>&1 | tee .devshots/crucible-preparation/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crucible-preparation-verification
          path: .devshots/crucible-preparation
          retention-days: 7
      - name: Commit verified implementation and remove temporary delivery files
        shell: bash
        run: |
          git rm -- .crucible-delivery/part1.b64 .crucible-delivery/part2.b64 .crucible-delivery/part3.b64 .crucible-delivery/part4.b64 .github/workflows/crucible-review-bundle.yml
          git add -- assets/ui/orrery/crucible-equipment.svg docs/CRUCIBLE_PREPARATION_UI.md scripts/check-crucible-preparation-ui.mjs src/ui/orrery/crucibleArmory.js src/ui/orrery/cruciblePreparation.js src/ui/orrery/cruciblePreparationLayouts.js src/ui/orrery/equipmentGlyphs.js src/ui/orrery/slotJig.js src/ui/screens/crucible.js src/ui/screens/crucibleDraft.js test/crucible-visual-preparation.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): redesign Crucible preparation and visual armory'
          git show --stat --oneline HEAD
          git push origin HEAD:frontend/crucible-visual-armory
