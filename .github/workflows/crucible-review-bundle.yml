name: Crucible review source bundle
on:
  push:
    branches: [frontend/crucible-visual-armory]
    paths: [.github/workflows/crucible-review-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /tools/ui-bench*
            /tools/ui-fixtures*
            /vendor/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev
      - name: Pack bench runtime
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('/tmp/crucible-review-runtime.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for folder in ['tools', 'vendor', 'node_modules']:
                  for path in pathlib.Path(folder).rglob('*'):
                      if path.is_file():
                          archive.write(path, str(path))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crucible-review-runtime
          path: /tmp/crucible-review-runtime.zip
          retention-days: 1
