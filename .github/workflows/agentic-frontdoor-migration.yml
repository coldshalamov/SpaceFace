name: Agentic front-door migration

on:
  push:
    branches:
      - agentic/central-brain-quality-convergence

permissions:
  contents: write

jobs:
  patch-front-door:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentic/central-brain-quality-convergence
          fetch-depth: 0

      - name: Patch canonical routing and generic prompts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          canonical_path = Path('CANONICAL_BUILD_MAP.md')
          text = canonical_path.read_text(encoding='utf-8')

          old_step = '''5. If the user did not name an exact unit, use the copy-ready
             [`design/program/AGENT_TASK_PROMPTS.md`](./design/program/AGENT_TASK_PROMPTS.md), then run
             `node scripts/program-dispatch.mjs --next` for the first exact dependency-front unit,
             `node scripts/program-dispatch.mjs --ready` for every currently dependency-front unit, or
             `node scripts/program-dispatch.mjs --id PQ-XXX` for one parent outcome. The dispatcher includes
             implementation, acceptance-repair, capture, evidence-review, performance, and integration units, so a
             headless-complete parent is not redispatched as feature work. Open the raw
             [`program-queue.json`](./design/program/roadmap/program-queue.json) only when maintaining its
             index/dispatch units or diagnosing dependency/identity history.'''
          new_step = '''5. If the user named an exact unit, route it directly with
             `node scripts/program-dispatch.mjs --id PQ-XXX`. If the user did **not** name an exact unit, start at
             [`design/program/CENTRAL_BRAIN.md`](./design/program/CENTRAL_BRAIN.md) and the copy-ready
             [`design/program/AGENT_TASK_PROMPTS.md`](./design/program/AGENT_TASK_PROMPTS.md), then run
             `python tools/agentic/select_next_work.py --format prompt` for one quality-ranked dependency-front unit,
             or `python tools/agentic/manager_cycle.py --refresh --limit 3` for a bounded campaign slate.
             `node scripts/program-dispatch.mjs --ready` remains the canonical dependency-ready read view and
             `program-queue.json` remains the only admitted machine index; the Central Brain ranks that work but
             never creates a second queue or acceptance authority. Open the raw queue only when maintaining its
             index/dispatch units or diagnosing dependency/identity history.'''
          if old_step not in text:
              raise SystemExit('canonical step 5 marker changed; refusing partial migration')
          text = text.replace(old_step, new_step, 1)

          old_next = '''- `NEXT` → one admitted queue unit, then stop. Use `program-dispatch --next/--ready/--id`.
            Ordinary `--next` still prefers fleet remaster (`PQ-050`). Hitching is not that door.'''
          new_next = '''- `NEXT` / **broad unnamed development** → use the Central Brain selector over the existing
            dependency-ready PQ graph: `python tools/agentic/select_next_work.py --format prompt`. The selector
            ranks current work by demonstrated player exposure, severity, recurrence, evidence confidence, leverage,
            and coarse cost. It does not admit work or mutate queue truth. For an exact PQ, bypass ranking and use
            `program-dispatch --id PQ-XXX`. `PQ-050` remains a valid graphics campaign but has no universal default
            privilege over controls, combat, integrity, hitches, VFX, UI, or other higher-leverage current debt.'''
          if old_next not in text:
              raise SystemExit('canonical NEXT marker changed; refusing partial migration')
          text = text.replace(old_next, new_next, 1)

          campaign_start = text.index('- **Campaign / overnight / “non-INFERENCE work in this map”')
          campaign_end = text.index('\n**PQ-050 campaign law:**', campaign_start)
          new_campaign = '''- **Campaign / overnight / “non-INFERENCE work in this map” / “do all of it”** → run a
            **Central Brain convergence campaign over admitted work**, not a hard-coded asset family. Start with
            `python tools/agentic/manager_cycle.py --refresh --limit 3`; execute the highest-ranked dependency-front
            player outcome, integrate/prove it, then **refresh the ranking before the next unit**. Preserve campaign
            balance: an actionable core RED (integrity, primary controls/flight, primary combat/AI, or severe frame
            liveness) normally outranks optional L3 micro-detail. Presentation, VFX, UI and breadth continue in
            parallel when they are the stronger player-value move. `PQ-050` runs as the campaign only when the user
            explicitly asks for that fleet remaster or the current director evidence ranks its next ship above the
            alternatives. Do not open INFERENCE unless explicitly requested or the highest-confidence demonstrated
            debt has no admitted implementation; in that case emit one bounded INFERENCE candidate and return it to
            normal admission. Do not stop after one leaf when the user asked for a campaign.'''
          text = text[:campaign_start] + new_campaign + text[campaign_end:]
          text = text.replace('**PQ-050 campaign law:**',
                              '**PQ-050 explicit graphics campaign law (only when the user/director selected PQ-050):**', 1)
          text = text.replace('`node scripts/program-dispatch.mjs --id PQ-050` or `--next` for the first ready ship.',
                              '`node scripts/program-dispatch.mjs --id PQ-050` for the first ready ship when this campaign is explicitly selected.', 1)
          text = text.replace('Dispatch: `node scripts/program-dispatch.mjs --id PQ-129`. `--next` still returns `PQ-050`.',
                              'Dispatch: `node scripts/program-dispatch.mjs --id PQ-129`. Broad unnamed work is ranked through the Central Brain selector.', 1)

          insertion_marker = '## 2. Product north star\n'
          central_section = '''## 1A. Central Brain quality-convergence layer\n\nFor the full architecture behind broad autonomous development, read\n[`docs/agentic-development/AGENTIC_GAME_DEVELOPMENT_OS.md`](./docs/agentic-development/AGENTIC_GAME_DEVELOPMENT_OS.md)\nand its focused plans for\n[observability/replay](./docs/agentic-development/OBSERVABILITY_REPLAY_AND_PLAYTEST_ARCHITECTURE.md),\n[quality scorecard](./docs/agentic-development/QUALITY_SCORECARD.md),\n[plan convergence](./docs/agentic-development/PLAN_CONVERGENCE_PROTOCOL.md),\n[content factory](./docs/agentic-development/CONTENT_FACTORY_AND_COMPLETENESS.md),\n[bounded INFERENCE](./docs/agentic-development/INFERENCE_PROTOCOL.md),\n[visual/VFX direction](./docs/agentic-development/VISUAL_DIRECTION_AND_VFX_SYSTEM.md),\n[performance governance](./docs/agentic-development/PERFORMANCE_GOVERNANCE.md), and the\n[implementation roadmap](./docs/agentic-development/IMPLEMENTATION_ROADMAP.md).\n\nThe manager loop is `observe -> reduce -> rank -> assign -> implement -> replay -> compare -> keep/revert`.\nIt consumes the **existing** PQ graph. It never replaces `program-queue.json`, active packets, receipts,\nor user priority. Use screenshots for appearance, deterministic/lifecycle telemetry for temporal truth,\nand one cold reviewer only where subjective judgment adds information. Unknown evidence is not a green\nquality claim. Fixed pass/reviewer counts are not universal quality gates.\n\n'''
          if insertion_marker not in text:
              raise SystemExit('canonical product north-star marker missing')
          text = text.replace(insertion_marker, central_section + insertion_marker, 1)
          canonical_path.write_text(text, encoding='utf-8')

          prompts_path = Path('design/program/AGENT_TASK_PROMPTS.md')
          prompts = prompts_path.read_text(encoding='utf-8')
          prompts = prompts.replace('refreshed: 2026-08-09', 'refreshed: 2026-08-29', 1)

          old_door = '''- **Finish a known exact task** → use Prompts A/B/C below, or
            `node scripts/program-dispatch.mjs --next/--ready/--id`. The queue is unchanged.
          - **Spend inference making the game richer** — NPCs, enemies, sectors, economy, story, graphics, VFX,
            audio, gameplay feel, content, a playable slice → start at
            [`INFERENCE_LANES.md`](./INFERENCE_LANES.md). It indexes the reusable `WF-01`–`WF-19` workflows with
            the `1x`/`3x`/`5x` scale shorthand and a copy-ready activation prompt. Concrete implementation work
            the lane produces still goes through the normal ownership/packet/acceptance system.'''
          new_door = '''- **Finish a known exact task** → use Prompts B/C below or
            `node scripts/program-dispatch.mjs --id PQ-XXX`. Exact user scope outranks manager ranking.
          - **NEXT / develop the game / broad unnamed work** → start at [`CENTRAL_BRAIN.md`](./CENTRAL_BRAIN.md)
            and run `python tools/agentic/select_next_work.py --format prompt`. For a multi-unit campaign use
            `python tools/agentic/manager_cycle.py --refresh --limit 3`, integrate one bounded result, then refresh.
          - **Spend INFERENCE deliberately** — NPCs, enemies, sectors, economy, story, graphics, VFX, audio,
            gameplay feel, content, a playable slice → start at [`INFERENCE_LANES.md`](./INFERENCE_LANES.md)
            only when the user said INFERENCE or demonstrated debt has no admitted implementation. It indexes the
            reusable `WF-01`–`WF-19` workflows with `1x`/`3x`/`5x`; production still returns through normal
            ownership/packet/acceptance.'''
          if old_door not in prompts:
              raise SystemExit('prompt door marker changed')
          prompts = prompts.replace(old_door, new_door, 1)

          old_threads = '''Give Prompt A to each thread, or give different concrete prompts from the bottom of this file. Each
          thread reads the same `NOW.md` and `--ready` list. If two threads initially inspect the same task, the
          first one that actually begins mutation records the short exact-path row; the other chooses the next
          task and keeps working. No coordinator, permanent lane, or worktree is required.'''
          new_threads = '''For broad multi-thread work, let one manager invocation rank a slate first, then give disjoint exact
          units to workers. Keep the existing `NOW.md` exact-path collision rule; do not create permanent subsystem
          ownership. For several unrelated exact tasks, Prompt B may still be dispatched independently. Parallelism
          is bounded by write-surface and integration bandwidth, not by how many agents are available.'''
          if old_threads in prompts:
              prompts = prompts.replace(old_threads, new_threads, 1)

          a0_start = prompts.index('## Prompt A0 — overnight / “the work in the build map” / non-INFERENCE')
          a0_end = prompts.index('\n## Prompt A0-P — hitching', a0_start)
          new_a0 = '''## Prompt A0 — overnight / “the work in the build map” / non-INFERENCE\n\n```text\nThis is a Central Brain convergence campaign, not one task and not a hard-coded graphics loop. Start at CANONICAL_BUILD_MAP.md and design/program/CENTRAL_BRAIN.md. Do not use INFERENCE unless the user explicitly asked for it or demonstrated quality debt has no admitted implementation.\n\nRun `python tools/agentic/manager_cycle.py --refresh --limit 3`. Take the highest-ranked dependency-front admitted unit, open its exact PQ packet with `node scripts/program-dispatch.mjs --id PQ-XXX`, and deliver that bounded player outcome. Reuse the existing lab, observatory, runtime witness, broker and visual capture tools instead of inventing a parallel harness.\n\nAfter each integrated unit, refresh the manager ranking before selecting the next. Do not let one prestige-art family consume the whole campaign while actionable integrity, flight/control, combat/AI or severe hitch debt is red. Do not count scouts, plans, tests or reviews as production.\n\nFor subjective visual work, review at the shipping camera; use one cold reviewer by default and continue only for a named visible defect. Fixed pass/reviewer quotas are not universal gates. For feel/performance work, make one causal intervention and replay the same seed/input policy; after two failed cycles under the same causal model, change the model rather than looping.\n\nKeep going until the user's campaign scope/budget is exhausted, no admitted dependency-front work remains, or the next highest-value item requires an explicit product decision/external dependency.\n```\n'''
          prompts = prompts[:a0_start] + new_a0 + prompts[a0_end:]

          a_start = prompts.index('## Prompt A — find and finish the next task')
          a_end = prompts.index('\n## Prompt B — finish one exact queue unit', a_start)
          new_a = '''## Prompt A — find and finish the next task\n\n```text\nFinish one highest-leverage SpaceFace task end to end.\n\nStart at CANONICAL_BUILD_MAP.md, design/program/CENTRAL_BRAIN.md and design/program/NOW.md. Run `python tools/agentic/select_next_work.py --format prompt` and take the returned dependency-front unit. Then open that unit through `node scripts/program-dispatch.mjs --id PQ-XXX` and its active packet. The selector ranks the existing queue; it does not replace it.\n\nBefore mutation, use the packet's narrowest existing deterministic/live scenario to characterize the player-visible claim. Name one causal hypothesis. Add a NOW row only while actually editing. Preserve foreign dirty hunks and choose a disjoint unit if necessary.\n\nImplement the bounded outcome. Reuse existing owners and instrumentation. Replay the same scenario/seed/input policy after mutation and keep the change only if the claimed player result improves without a new regression. Do not loop on an unchanged failure fingerprint.\n\nStop after one finished task. Final report: RESULT, PLAYER RESULT, COMMIT, PROOF, REMAINING, NEXT ACTION, DIRTY PATHS.\n```\n'''
          prompts = prompts[:a_start] + new_a + prompts[a_end:]

          prompts = prompts.replace('Take the first claimable leaf. --next still returns fleet remaster.',
                                    'Take the first claimable leaf. This is an explicit PQ-130 campaign; do not substitute the global selector mid-leaf.')
          prompts = prompts.replace('three subagent reviews listing every defect at play size; revise until KEEP;',
                                    'one shipping-camera composite review by default; revise only named play-size defects and stop on marginal no-gain rather than a fixed reviewer/pass quota;')
          prompts_path.write_text(prompts, encoding='utf-8')
          PY

      - name: Validate migrated control plane
        run: |
          python tools/agentic/validate_control_plane.py
          git diff --check

      - name: Commit migration to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration diff"
            exit 0
          fi
          git config user.name "spaceface-control-plane-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CANONICAL_BUILD_MAP.md design/program/AGENT_TASK_PROMPTS.md
          git commit -m "docs(agentic): route broad development through Central Brain"
          git push origin HEAD:agentic/central-brain-quality-convergence
