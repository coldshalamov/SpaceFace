name: Branch consolidation audit

on:
  push:
    branches:
      - integration/all-branches-20260824
    paths:
      - scripts/branch-consolidation-audit.mjs
      - .github/workflows/branch-consolidation-audit.yml
  pull_request:
    branches:
      - master
    paths:
      - scripts/branch-consolidation-audit.mjs
      - .github/workflows/branch-consolidation-audit.yml

permissions:
  contents: write

concurrency:
  group: branch-consolidation-audit-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with complete filtered history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Fetch every remote branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --force

      - name: Compute patch-equivalent branch inventory
        run: node scripts/branch-consolidation-audit.mjs

      - name: Upload complete branch ledger
        uses: actions/upload-artifact@v4
        with:
          name: branch-consolidation-inventory
          path: design/program/branch-consolidation/
          retention-days: 14

      - name: Commit durable audit ledger on direct branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name "spaceface-integration-bot"
          git config user.email "spaceface-integration-bot@users.noreply.github.com"
          git add design/program/branch-consolidation/
          if git diff --cached --quiet; then
            echo "Inventory is unchanged."
            exit 0
          fi
          git commit -m "chore(integration): inventory every remote branch [skip ci]"
          git push origin HEAD:integration/all-branches-20260824
