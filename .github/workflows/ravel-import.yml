name: Import Ravel character
on:
  push:
    branches: ['character/ravel-unraveller-20261003']
    paths: ['.ravel-delivery/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.ravel-delivery/
            /src/
            /vendor/
            /test/
            /tools/ravel/
            /scripts/
            /design/characters/
            /assets/*.json
            /assets/**/*.json
            /index.html
            /package.json
      - name: Verify and apply the exact reviewed feature patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          raw = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in sorted(pathlib.Path('.ravel-delivery').glob('part*.b64')))))
          assert hashlib.sha256(raw).hexdigest() == '9fc2355ca3dc03d732e9b68346319469b98d93dd349113f9c7429944d8312afe', 'Delivery hash mismatch'
          payload = json.loads(raw)
          patch = pathlib.Path('/tmp/ravel.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run(['git', 'add', '--', *payload['paths']], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: RAVEL gravity-loom encounter, authored assets, persistence and tests'
          git show --stat --oneline HEAD
          git push origin HEAD:character/ravel-unraveller-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use vendored engines
        run: |
          mkdir -p node_modules/three node_modules/@dimforge/rapier3d-compat
          printf '%s' '{"name":"three","type":"module","exports":{".":"./three.module.js","./addons/*":"./addons/*"}}' > node_modules/three/package.json
          ln -s ../../vendor/three.module.js node_modules/three/three.module.js
          ln -s ../../vendor/three.core.js node_modules/three/three.core.js
          ln -s ../../vendor/addons node_modules/three/addons
          printf '%s' '{"name":"@dimforge/rapier3d-compat","type":"module","exports":"./rapier.mjs"}' > node_modules/@dimforge/rapier3d-compat/package.json
          ln -s ../../../vendor/rapier3d-compat/rapier.mjs node_modules/@dimforge/rapier3d-compat/rapier.mjs
      - run: node --test test/ravel.test.mjs test/ravel-model.test.mjs
      - name: Install browser client
        run: |
          mkdir -p "$RUNNER_TEMP/ravel-tools"
          cd "$RUNNER_TEMP/ravel-tools"
          printf '{"private":true}' > package.json
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000 playwright@1.56.1
      - name: Review the actual encounter in Chromium
        run: RAVEL_PLAYWRIGHT="$RUNNER_TEMP/ravel-tools/node_modules/playwright/index.mjs" node tools/ravel/review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ravel-character-review
          path: .ravel-review/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
