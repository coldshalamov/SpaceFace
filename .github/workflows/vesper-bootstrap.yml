name: Vesper delivery validation
on:
  push:
    branches: [feat/vesper-signal-moth]
    paths: [.vesper-bootstrap/packet.json]
permissions:
  contents: write
concurrency:
  group: vesper-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch source without heavyweight art
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git -C source sparse-checkout init --cone
          git -C source sparse-checkout set src test scripts vendor design/characters .vesper-bootstrap .github/workflows
          git -C source checkout -b "$GITHUB_REF_NAME" FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source packet
        working-directory: source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,zlib
          root=pathlib.Path('.').resolve()
          manifest=json.loads((root/'.vesper-bootstrap/packet.json').read_text())
          encoded=''.join((root/'.vesper-bootstrap'/('part'+str(i)+'.b64')).read_text().strip() for i in range(manifest['parts']))
          raw=zlib.decompress(base64.b64decode(encoded))
          if hashlib.sha256(raw).hexdigest()!=manifest['sha256']: raise SystemExit('Packet checksum mismatch')
          packet=json.loads(raw)
          planned={}
          def path(name):
              p=(root/name).resolve()
              if not p.is_relative_to(root) or name.startswith('.') or p.is_symlink(): raise SystemExit('Unsafe packet path: '+name)
              return p
          for name,hunks in packet['hunks'].items():
              p=path(name); original=p.read_bytes(); newline=b'\r\n' if b'\r\n' in original else b'\n'; text=original.decode().replace('\r\n','\n')
              for old,new in hunks:
                  if new in text: continue
                  if text.count(old)!=1: raise SystemExit('Integration anchor conflict: '+name)
                  text=text.replace(old,new,1)
              planned[p]=text.replace('\n',newline.decode()).encode()
          for name,text in packet['files'].items():
              p=path(name); content=text.encode()
              if p.exists() and p.read_bytes()!=content: raise SystemExit('Refusing existing owned-file overwrite: '+name)
              planned[p]=content
          for p,content in planned.items(): p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          (root/'.vesper-bootstrap/paths.json').write_text(json.dumps([str(p.relative_to(root)) for p in planned]))
          PY
      - name: Use pinned vendored runtime dependencies
        working-directory: source
        run: |
          mkdir -p node_modules/three node_modules/@dimforge/rapier3d-compat
          printf '{"name":"three","type":"module","exports":{".":"./three.module.js","./addons/*":"./addons/*"}}' > node_modules/three/package.json
          ln -s ../../vendor/three.module.js node_modules/three/three.module.js
          ln -s ../../vendor/three.core.js node_modules/three/three.core.js
          ln -s ../../vendor/addons node_modules/three/addons
          printf '{"name":"@dimforge/rapier3d-compat","type":"module","exports":"./rapier.mjs"}' > node_modules/@dimforge/rapier3d-compat/package.json
          ln -s ../../../vendor/rapier3d-compat/rapier.mjs node_modules/@dimforge/rapier3d-compat/rapier.mjs
      - name: Simulation, lifecycle, model and regression tests
        working-directory: source
        run: |
          mkdir -p .devshots/vesper
          set -o pipefail
          node --test test/vesper.test.mjs test/vesper-model.test.mjs test/morrow.test.mjs test/morrow-model.test.mjs | tee .devshots/vesper/tests.txt
      - name: Preserve complete implementation on the requested branch
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'SpaceFace Contributor'
          git config user.email 'spaceface-contributor@users.noreply.github.com'
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('.vesper-bootstrap/paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm -- .github/workflows/vesper-bootstrap.yml .vesper-bootstrap/packet.json .vesper-bootstrap/part*.b64
          git commit -m 'feat(vesper): add physical kinetic-choir character, authored rig and tested integration'
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Install isolated browser test tooling
        working-directory: source
        run: |
          VERSION=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')
          npm install --prefix "$RUNNER_TEMP/vesper-tools" --ignore-scripts "playwright@$VERSION"
          "$RUNNER_TEMP/vesper-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Review actual production rig in WebGL and exercise public bench controls
        working-directory: source
        env:
          VESPER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/vesper-tools/node_modules/playwright/index.mjs
        run: node scripts/characters/check-vesper-browser.mjs
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-validation
          path: source/.devshots/vesper
          retention-days: 14
