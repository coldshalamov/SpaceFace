name: RUCKUS scoped development bundle
on:
  push:
    branches: [character/ruckus-last-demolition]
    paths: [.github/workflows/ruckus-source-bundle.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            src
            test
            scripts
            tools/blender/forge
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pack scoped sources and dependencies (never the large asset library)
        run: tar -czf ruckus-development-source.tar.gz src test scripts tools/blender/forge node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: ruckus-development-source
          path: ruckus-development-source.tar.gz
          retention-days: 2
          compression-level: 0
