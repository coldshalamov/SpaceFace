name: bracket-publish
on:
  push:
    branches: [feature/bracket-scrapball-keeper]
    paths: [tools/bracket/publish-ready.txt]
permissions:
  contents: write
jobs:
  apply-tested-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bracket-scrapball-keeper
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            test
            vendor
            tools/bracket
            design/characters
            .github/workflows/bracket-publish.yml
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand and verify the authored packet
        run: |
          python3 tools/bracket/publish-packet.py
          git apply --check tools/bracket/integration.patch
          git apply tools/bracket/integration.patch
          mkdir -p node_modules/three node_modules/@dimforge/rapier3d-compat
          printf '%s' '{"type":"module","name":"three","exports":{".":"./three.module.js","./addons/*":"./addons/*"}}' > node_modules/three/package.json
          ln -s ../../vendor/three.module.js node_modules/three/three.module.js
          ln -s ../../vendor/three.core.js node_modules/three/three.core.js
          ln -s ../../vendor/addons node_modules/three/addons
          printf '%s' '{"type":"module","name":"@dimforge/rapier3d-compat","exports":"./rapier.mjs"}' > node_modules/@dimforge/rapier3d-compat/package.json
          ln -s ../../../vendor/rapier3d-compat/rapier.mjs node_modules/@dimforge/rapier3d-compat/rapier.mjs
          node --test test/bracket.test.mjs test/bracket-model.test.mjs test/morrow.test.mjs test/morrow-model.test.mjs
      - name: Publish only the character paths and remove the one-shot bootstrap
        run: |
          git config user.name 'SpaceFace character implementation'
          git config user.email 'spaceface-agent@users.noreply.github.com'
          git add -- src/data/bracket.js src/characters/bracketRules.js src/systems/bracket.js src/render/characters/bracketModel.js test/bracket.test.mjs test/bracket-model.test.mjs tools/bracket/index.html tools/bracket/bench.js design/characters/BRACKET.md
          git add -- src/core/registry.js src/runtime/authoritativeSystemManifest.js src/runtime/nodeSystemFactoryTable.js src/render/visualFactory.js src/save/saveSystem.js src/data/audioRecipes.js test/authoritative-manifest.test.mjs
          git rm -- .github/workflows/bracket-publish.yml tools/bracket/publish-packet.py tools/bracket/packet.json tools/bracket/integration.patch tools/bracket/publish-ready.txt
          git commit -m 'feat(bracket): ship authored scrapball keeper, physics court, persistence and tests'
          git show --stat --oneline HEAD
          git push origin HEAD:feature/bracket-scrapball-keeper
