name: Racing refinement workbench
on:
  push:
    branches: [feat/racing-steer-mode]
    paths: [.github/workflows/racing-refinement-workbench.yml, 'scripts/racing-refinement-data/**']
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'coldshalamov/SpaceFace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPACEFACE_PLAYER_STORE_DIR: ''
      RACING_ARTIFACT_DIR: /tmp/racing-review/ui
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/artifacts/
            !/.devshots/
            !/node_modules/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed sources with byte preconditions
        shell: bash
        run: |
          mkdir -p /tmp/racing-review
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          data=pathlib.Path('scripts/racing-refinement-data')
          packed=''.join((data/f'{i:02}.b64').read_text() for i in range(1,4))
          raw=lzma.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='3bcbc02e095817e469a76c0a39654b4cab45111bf61ab1b1ff7593ebae129998'
          rows=json.loads(raw); writes={}; root=pathlib.Path.cwd().resolve()
          assert len(rows)==28
          for row in rows:
              name=row['path']; p=pathlib.Path(name)
              assert name=='build_map.md' or name.startswith(('src/','test/','docs/','design/program/'))
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert p.resolve().is_relative_to(root)
              old=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(old).hexdigest()==row['base'],f'Concurrent or baseline mismatch: {name}'
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=[text]
              writes[name]=''.join(lines).encode()
          for name,content in writes.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          pathlib.Path('/tmp/racing-review/paths.json').write_text(json.dumps(list(writes)))
          subprocess.run(['git','add','--',*writes],check=True)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'],check=True)
          print('Applied 28 owned files; every original byte hash verified.')
          PY
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused simulation, save and real Three.js regression tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test test/racingMode.test.js test/racing-refinement.test.mjs test/racing-render.test.mjs test/mobile-flight.test.mjs test/crucible-contamination.test.mjs test/pro-06-exit-to-menu-autosave.test.mjs test/camera-glide.test.mjs test/camera-glide-integration.test.mjs test/camera-clearance-floor-retain.test.mjs test/camera-focus-separation.test.mjs test/chase-lookat-retain.test.mjs test/camera-neutral-pair.test.mjs test/camera-nimble-regime.test.mjs 2>&1 | tee /tmp/racing-review/tests.log
      - name: Install browser
        run: npx playwright install chromium
      - name: Actual circuit UI interaction and responsive probe
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node test/racing-ui-probe.mjs 2>&1 | tee /tmp/racing-review/ui.log
      - name: Create validated candidate without moving the PR branch
        if: steps.unit.outcome == 'success' && steps.ui.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];parent=os.environ['GITHUB_SHA']
          def api(path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          base=api('/git/commits/'+parent)['tree']['sha']; entries=[]
          names=json.loads(pathlib.Path('/tmp/racing-review/paths.json').read_text())
          for name in names:
              sha=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(pathlib.Path(name).read_bytes()).decode()})['sha']
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          for name in ['.github/workflows/racing-refinement-workbench.yml',*[f'scripts/racing-refinement-data/{i:02}.b64' for i in range(1,4)]]:
              entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=api('/git/commits',{'tree':tree,'parents':[parent],'message':'feat(race): refine chase flight, fair circuits, course instruments and campaign-safe launches\n\nAdd camera hotkey/phase leases, hull-relative blending and clearance; close laps and repair ordered swept gates, recovery and records. Add vertical course gates, visible pace beacon, responsive route HUD and result board; protect campaign saves and mobile/grid input. Route eight complementary expansion packets from build_map.\n\nValidated with focused Node/Three.js tests and actual UI browser component interactions. Full asset-loaded gameplay and device performance remain separate evidence. Remove temporary review transport.'})
          receipt={'parent':parent,'sha':commit['sha'],'tree':tree,'files':names,'scope':'Node/Three.js and browser component fixtures; not full asset-loaded gameplay.'}
          pathlib.Path('/tmp/racing-review/candidate.json').write_text(json.dumps(receipt,indent=2))
          print('VALIDATED_CANDIDATE='+commit['sha'])
          PY
      - name: Preserve review evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/racing-review
          git diff --cached --stat > /tmp/racing-review/change-stat.txt
          if [ -d node_modules/three ]; then tar -czf /tmp/racing-review/three-for-local-tests.tgz node_modules/three; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racing-review
          path: /tmp/racing-review
          retention-days: 3
      - name: Require both verification scopes
        if: steps.unit.outcome != 'success' || steps.ui.outcome != 'success'
        run: exit 1
