<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpaceFace Stranger Journey Host</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/addons/",
      "@dimforge/rapier3d-compat": "/vendor/rapier3d-compat/rapier.mjs",
      "@floating-ui/dom": "/node_modules/@floating-ui/dom/dist/floating-ui.dom.browser.mjs",
      "@floating-ui/core": "/node_modules/@floating-ui/core/dist/floating-ui.core.browser.mjs",
      "@floating-ui/utils": "/node_modules/@floating-ui/utils/dist/floating-ui.utils.mjs"
    }
  }
  </script>
</head>
<body>
  <p id="status">stranger-journey-host ready</p>
  <script type="module">
    window.__SF_STRANGER_LAB__ = { ready: false, status: 'loading' };
    try {
      const hostModule = await import('/tools/agentic/stranger-lab/lib/browserJourneyHost.js');
      const host = window.__SF_STRANGER_LAB__ || {};
      Object.assign(host, {
        replayJourneyTape: hostModule.replayJourneyTape,
        journeyWorldStepped: hostModule.journeyWorldStepped,
        ready: true,
        status: 'ready',
      });
      window.__SF_STRANGER_LAB__ = host;
      document.getElementById('status').textContent = 'stranger-journey-host modules loaded';
    } catch (error) {
      const host = window.__SF_STRANGER_LAB__ || {};
      host.ready = false;
      host.status = 'error';
      host.error = error && error.message ? error.message : String(error);
      host.stack = error && error.stack ? String(error.stack).slice(0, 2000) : '';
      window.__SF_STRANGER_LAB__ = host;
      document.getElementById('status').textContent = 'stranger-journey-host module error';
      console.error('[SpaceFace stranger] journey host module failed', error);
    }
  </script>
</body>
</html>
